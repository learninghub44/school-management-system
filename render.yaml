# Render deployment config — one of several valid hosting options for this
# project (see README.md "Deploy anywhere" section). Works with any Postgres
# DATABASE_URL — Render Postgres, Railway, Neon, Supabase, self-hosted, etc.

services:
  - type: web
    name: kadem-zetu-sms-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: 10h
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Paystack (live keys — set in Render dashboard)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # NOTE: replace the placeholder domains below with wherever you actually
      # host the frontend / this Render service — they're examples, not fixed
      # requirements.
      - key: PAYSTACK_CALLBACK_URL
        value: https://your-frontend-domain.example/subscription.html
      # Pesapal (live — set in Render dashboard)
      - key: PESAPAL_BASE_URL
        value: https://pay.pesapal.com/v3/api
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        value: https://your-frontend-domain.example/subscription.html
      - key: PESAPAL_IPN_URL
        value: https://your-render-service.onrender.com/api/subscriptions/ipn
      - key: PESAPAL_IPN_ID
        sync: false
      # Groq AI
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Support contact (used in AI assistant identity)
      - key: PLATFORM_SUPPORT_EMAIL
        value: support@cbcerp.co.ke
