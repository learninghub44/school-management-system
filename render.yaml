services:
  - type: web
    name: cbc-school-erp-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: 10h
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
