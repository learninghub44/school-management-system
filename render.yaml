services:
  - type: web
    name: cbc-school-erp-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: 10h
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Paystack (live keys — set in Render dashboard)
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://cbc-school-erp.pages.dev/subscription.html
      # Pesapal (live — set in Render dashboard)
      - key: PESAPAL_BASE_URL
        value: https://pay.pesapal.com/v3/api
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_CALLBACK_URL
        value: https://cbc-school-erp.pages.dev/subscription.html
      - key: PESAPAL_IPN_URL
        value: https://cbc-school-erp-api.onrender.com/api/subscriptions/ipn
      - key: PESAPAL_IPN_ID
        sync: false
      # Groq AI
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
    healthCheckPath: /api/health
