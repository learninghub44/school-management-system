[build]
  builder = "NIXPACKS"
  buildCommand = "npm install --prefix backend"

[deploy]
  startCommand = "node backend/server.js"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

# ── Required environment variables (set in Railway dashboard) ─────
# NODE_ENV=production
# JWT_SECRET=<min 32 chars, random>
# JWT_EXPIRES=10h
# DATABASE_URL=<Supabase/Neon/Railway Postgres connection string>
# ALLOWED_ORIGINS=https://<your-railway-domain>.railway.app
#
# ── Payment (Paystack) ────────────────────────────────────────────
# PAYSTACK_SECRET_KEY=sk_live_...
# PAYSTACK_CALLBACK_URL=https://<your-railway-domain>.railway.app/subscription.html
#
# ── AI (Groq) ─────────────────────────────────────────────────────
# GROQ_API_KEY=gsk_...
# GROQ_MODEL=llama3-8b-8192
#
# ── Support ───────────────────────────────────────────────────────
# PLATFORM_SUPPORT_EMAIL=support@cbcerp.co.ke
