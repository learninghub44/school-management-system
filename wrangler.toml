name = "school-management-system"
main = "backend/worker-entry.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[alias]
"compression"         = "./backend/stubs/compression.js"
"morgan"              = "./backend/stubs/morgan.js"
"express-rate-limit"  = "./backend/stubs/express-rate-limit.js"
"body-parser"         = "./backend/stubs/body-parser.js"
"iconv-lite"          = "./backend/stubs/iconv-lite.js"
"raw-body"            = "./backend/stubs/raw-body.js"

[vars]
NODE_ENV = "production"
WORKER_RUNTIME = "true"
JWT_EXPIRES = "10h"
GROQ_MODEL = "openai/gpt-oss-20b"
PLATFORM_SUPPORT_EMAIL = "support@cbcerp.co.ke"
PAYSTACK_CALLBACK_URL = "https://cbc-school-erp.pages.dev/subscription.html"
ALLOWED_ORIGINS = "https://cbc-school-erp.pages.dev,https://school-management-system.chrisodhiambo444.workers.dev"

# ── Secrets — NEVER put values here. Set via Cloudflare dashboard or CLI ──────
# Run once per secret (use your real values):
#
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put PAYSTACK_SECRET_KEY
#   wrangler secret put GROQ_API_KEY
#
# Or: Cloudflare dashboard → Workers → school-management-system → Settings → Variables → Secrets

[observability]
enabled = true
