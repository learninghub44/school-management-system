<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Portal — CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="mainStyle"></style>
</head>
<body>
<div id="app"></div>

<!-- BULK ATTENDANCE MODAL -->
<div class="modal-bg" id="modal-att">
<div class="modal" style="max-width:640px">
  <div class="modal-hdr"><h3>Record Attendance</h3><button class="modal-close" data-close="modal-att">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="att-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Date *</label><input id="att-date" type="date"></div>
  </div>
  <button class="btn btn-ghost" id="btnLoadStudents" style="width:100%;margin-bottom:14px">Load Students</button>
  <div id="att-students" style="max-height:300px;overflow-y:auto;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px"></div>
  <div id="att-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-att">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAtt">Save Attendance</button>
  </div>
</div></div>

<!-- ASSESSMENT MODAL -->
<div class="modal-bg" id="modal-assess">
<div class="modal">
  <div class="modal-hdr"><h3>Record Assessment</h3><button class="modal-close" data-close="modal-assess">×</button></div>
  <div class="fg"><label>Student *</label><select id="asc-student"><option value="">Select Student</option></select></div>
  <div class="fg"><label>Learning Area *</label><select id="asc-subject"><option value="">Select</option></select></div>
  <div class="fg-row">
    <div class="fg"><label>Achievement Level *</label>
      <select id="asc-level"><option value="">Select</option>
        <option value="EE">EE – Exceeds Expectation</option>
        <option value="ME">ME – Meets Expectation</option>
        <option value="AE">AE – Approaches Expectation</option>
        <option value="BE">BE – Below Expectation</option>
      </select>
    </div>
    <div class="fg"><label>Score (0–100)</label><input id="asc-score" type="number" min="0" max="100"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Type *</label>
      <select id="asc-type"><option value="Formative">Formative</option><option value="Summative">Summative</option><option value="Project">Project</option><option value="Observation">Observation</option></select>
    </div>
    <div class="fg"><label>Term *</label>
      <select id="asc-term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
  </div>
  <div class="fg"><label>Teacher Comment</label><textarea id="asc-comment" maxlength="600"></textarea></div>
  <div id="asc-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-assess">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAssess">Save</button>
  </div>
</div></div>

<script type="module">
import { guardPage, esc, apiFetch, attendance, assessments, classes, schools } from "/js/api.js";
import { SHARED_CSS, buildSidebar, setupNav, openModal, closeModal, resetModal, showAlert, setLoading } from "/js/layout.js";
document.getElementById("mainStyle").textContent = SHARED_CSS;

let me = guardPage(["TEACHER"]);
if (!me) throw new Error();
const vRes = await apiFetch("/auth/verify");
if (!vRes?.success) { clearSession(); location.href="/login.html"; throw new Error(); }
me = vRes.user;

let myClasses=[], mySubjects=[], currentClassStudents=[];

const NAV = [
  { panel:"dashboard",  icon:"📊", label:"Dashboard" },
  { panel:"attendance", icon:"📋", label:"Attendance" },
  { panel:"assessments",icon:"📚", label:"Assessments" },
  { panel:"timetable",  icon:"🗓️", label:"Timetable" },
];

document.getElementById("app").innerHTML = `
${buildSidebar(NAV, "dashboard")}
<div class="main">
  <header class="topbar">
    <h3 id="pageTitle">Dashboard</h3>
    <div class="topbar-right">${esc(me.school_name)} · Term ${esc(String(me.current_term))}</div>
  </header>
  <div class="content">
    <div class="panel active" id="panel-dashboard">
      <div class="stat-grid" id="statsGrid"></div>
      <div class="card"><div class="card-hdr"><h4>My Assignments</h4></div><div class="card-body"><div class="table-wrap" id="assignTbl"><div class="empty">Loading…</div></div></div></div>
    </div>
    <div class="panel" id="panel-attendance">
      <div class="card">
        <div class="card-hdr"><h4>Attendance Records</h4><button class="btn btn-primary" id="btnAddAtt">+ Record Attendance</button></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAttClass"><option value="">All My Classes</option></select>
            <input type="date" id="filterAttDate">
          </div>
          <div class="table-wrap" id="attTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-assessments">
      <div class="card">
        <div class="card-hdr"><h4>CBC Assessments</h4><button class="btn btn-primary" id="btnAddAssess">+ Record Assessment</button></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAssessClass"><option value="">All My Classes</option></select>
            <select id="filterAssessTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
          </div>
          <div class="table-wrap" id="assessTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-timetable">
      <div class="card"><div class="card-hdr"><h4>My Timetable</h4></div>
        <div class="card-body"><div class="table-wrap" id="timetableTbl"><div class="empty">Loading…</div></div></div>
      </div>
    </div>
  </div>
</div>`;

setupNav({ dashboard:loadDashboard, attendance:loadAttendance, assessments:loadAssessments, timetable:loadTimetable });
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal-bg").forEach(bg=>bg.addEventListener("click",e=>{if(e.target===bg)closeModal(bg.id);}));

// get my teacher profile + assignments
const aRes = await apiFetch("/assignments", { });
const myAssignments = aRes?.data || [];
const classIds = [...new Set(myAssignments.map(a=>a.class_id))];

// Load my classes
const clRes = await classes.list({ academic_year: me.academic_year });
myClasses = (clRes?.data||[]).filter(c=>classIds.includes(c.id));

const laRes = await schools.learningAreas({});
mySubjects = laRes?.data || [];

// populate class dropdowns
["att-class","filterAttClass","filterAssessClass"].forEach(id=>{
  const el = document.getElementById(id);
  if (!el) return;
  const isFilter = id.startsWith("filter");
  el.innerHTML = (isFilter?'<option value="">All My Classes</option>':'<option value="">Select Class</option>') +
    myClasses.map(c=>`<option value="${esc(String(c.id))}">${esc(c.grade)}${c.stream?" "+esc(c.stream):""}</option>`).join("");
});

async function loadDashboard() {
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="val">${esc(String(myClasses.length))}</div><div class="lbl">Assigned Classes</div></div>
    <div class="stat-card"><div class="val">${esc(String(myAssignments.length))}</div><div class="lbl">Subject Assignments</div></div>
    <div class="stat-card"><div class="val">Term ${esc(String(me.current_term))}</div><div class="lbl">Current Term</div></div>`;
  if (!myAssignments.length) { document.getElementById("assignTbl").innerHTML='<div class="empty">No assignments yet</div>'; return; }
  document.getElementById("assignTbl").innerHTML = `<table><thead><tr><th>Class</th><th>Subject</th><th>Role</th><th>Year</th></tr></thead><tbody>
    ${myAssignments.map(a=>`<tr>
      <td><span class="badge bb">${esc(a.class_label)}</span></td>
      <td>${esc(a.subject_name)}</td>
      <td><span class="badge bg">${esc(a.role)}</span></td>
      <td>${esc(a.academic_year)}</td>
    </tr>`).join("")}
  </tbody></table>`;
}

async function loadAttendance() {
  document.getElementById("attTbl").innerHTML='<div class="empty">Loading…</div>';
  const r = await attendance.list({ class_id:document.getElementById("filterAttClass").value||undefined, date:document.getElementById("filterAttDate").value||undefined });
  const data=r?.data||[];
  if(!data.length){document.getElementById("attTbl").innerHTML='<div class="empty">No records</div>';return;}
  document.getElementById("attTbl").innerHTML=`<table><thead><tr><th>Student</th><th>Class</th><th>Date</th><th>Status</th></tr></thead><tbody>
    ${data.map(a=>`<tr><td>${esc(a.student_name)}</td><td><span class="badge bb">${esc(a.class_label)}</span></td><td>${a.date?new Date(a.date).toLocaleDateString("en-KE"):"–"}</td><td><span class="badge ${a.status==="Present"?"bg":a.status==="Late"?"by":"br"}">${esc(a.status)}</span></td></tr>`).join("")}
  </tbody></table>`;
}
document.getElementById("filterAttClass").addEventListener("change",loadAttendance);
document.getElementById("filterAttDate").addEventListener("change",loadAttendance);

async function loadAssessments() {
  document.getElementById("assessTbl").innerHTML='<div class="empty">Loading…</div>';
  const r = await assessments.list({ class_id:document.getElementById("filterAssessClass").value||undefined, term:document.getElementById("filterAssessTerm").value||undefined, academic_year:me.academic_year });
  const data=r?.data||[];
  if(!data.length){document.getElementById("assessTbl").innerHTML='<div class="empty">No assessments found</div>';return;}
  document.getElementById("assessTbl").innerHTML=`<table><thead><tr><th>Student</th><th>Subject</th><th>Level</th><th>Score</th><th>Term</th><th>Comment</th></tr></thead><tbody>
    ${data.map(a=>`<tr><td>${esc(a.student_name)}</td><td>${esc(a.subject_name)}</td><td><span class="level-${esc(a.achievement_level)}">${esc(a.achievement_level)}</span></td><td>${a.score!==null?esc(String(a.score)):"–"}</td><td>T${esc(String(a.term))}</td><td style="font-size:12px">${esc(a.teacher_comment||"–")}</td></tr>`).join("")}
  </tbody></table>`;
}
document.getElementById("filterAssessClass").addEventListener("change",loadAssessments);
document.getElementById("filterAssessTerm").addEventListener("change",loadAssessments);

async function loadTimetable() {
  document.getElementById("timetableTbl").innerHTML='<div class="empty">Loading…</div>';
  const r = await apiFetch("/reports/timetable",{});
  const data=r?.data||[];
  if(!data.length){document.getElementById("timetableTbl").innerHTML='<div class="empty">No timetable entries</div>';return;}
  document.getElementById("timetableTbl").innerHTML=`<table><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th></tr></thead><tbody>
    ${data.map(t=>`<tr><td><strong>${esc(t.day)}</strong></td><td>${esc(t.start_time)} – ${esc(t.end_time)}</td><td><span class="badge bb">${esc(t.class_label)}</span></td><td>${esc(t.subject_name)}</td></tr>`).join("")}
  </tbody></table>`;
}

// Open modals
document.getElementById("btnAddAtt").addEventListener("click",()=>{
  document.getElementById("att-date").value=new Date().toISOString().split("T")[0];
  openModal("modal-att");
});
document.getElementById("btnAddAssess").addEventListener("click",()=>{
  document.getElementById("asc-term").value=String(me.current_term);
  openModal("modal-assess");
});

// Load students for attendance
document.getElementById("btnLoadStudents").addEventListener("click",async()=>{
  const cid=document.getElementById("att-class").value;
  if(!cid){alert("Select a class.");return;}
  const r=await classes.students(cid);
  const data=r?.data||[];
  const con=document.getElementById("att-students");
  if(!data.length){con.innerHTML='<p style="color:#94a3b8;padding:8px;font-size:13px">No students</p>';return;}
  currentClassStudents=data;
  con.innerHTML=data.map(s=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #f1f5f9">
      <span style="font-size:13px"><strong>${esc(s.last_name)}, ${esc(s.first_name)}</strong> <code style="font-size:11px;color:#94a3b8">${esc(s.admission_number)}</code></span>
      <select data-sid="${esc(String(s.id))}" style="font-size:12px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:7px;background:#fff">
        <option value="Present">Present</option><option value="Absent">Absent</option><option value="Late">Late</option>
      </select>
    </div>`).join("");
  // Also populate assessment student dropdown
  document.getElementById("asc-student").innerHTML='<option value="">Select Student</option>'+
    data.map(s=>`<option value="${esc(String(s.id))}">${esc(s.last_name)}, ${esc(s.first_name)}</option>`).join("");
  // Filter learning areas by this class's stage
  const cls=myClasses.find(c=>String(c.id)===cid);
  if(cls){
    const filtered=mySubjects.filter(la=>la.stage===cls.stage);
    document.getElementById("asc-subject").innerHTML='<option value="">Select Subject</option>'+
      filtered.map(la=>`<option value="${esc(String(la.id))}">${esc(la.name)}</option>`).join("");
  }
});

// Submit attendance
document.getElementById("btnSubmitAtt").addEventListener("click",async()=>{
  const cid=document.getElementById("att-class").value;
  const date=document.getElementById("att-date").value;
  const alertEl=document.getElementById("att-alert");
  if(!cid||!date) return showAlert(alertEl,"Select class and date.");
  const sels=document.querySelectorAll("#att-students select[data-sid]");
  if(!sels.length) return showAlert(alertEl,"Load students first.");
  const records=Array.from(sels).map(s=>({student_id:s.dataset.sid,status:s.value}));
  setLoading("btnSubmitAtt",true);
  const r=await attendance.bulk({class_id:parseInt(cid),date,records});
  setLoading("btnSubmitAtt",false);
  if(r?.success){showAlert(alertEl,`✓ ${r.count} records saved.`,"ok");setTimeout(()=>{closeModal("modal-att");loadAttendance();},1200);}
  else showAlert(alertEl,r?.message||"Error.");
});

// Submit assessment
document.getElementById("btnSubmitAssess").addEventListener("click",async()=>{
  const sid=document.getElementById("asc-student").value;
  const lid=document.getElementById("asc-subject").value;
  const level=document.getElementById("asc-level").value;
  const term=document.getElementById("asc-term").value;
  const cid=document.getElementById("filterAssessClass").value||document.getElementById("att-class").value;
  const alertEl=document.getElementById("asc-alert");
  if(!sid||!lid||!level||!term) return showAlert(alertEl,"Student, subject, level and term required.");
  setLoading("btnSubmitAssess",true);
  const r=await assessments.create({
    student_id:sid, class_id:parseInt(cid)||myClasses[0]?.id,
    learning_area_id:parseInt(lid), achievement_level:level,
    score:document.getElementById("asc-score").value||null,
    assessment_type:document.getElementById("asc-type").value,
    term:parseInt(term), academic_year:me.academic_year,
    teacher_comment:document.getElementById("asc-comment").value.trim()||null,
  });
  setLoading("btnSubmitAssess",false);
  if(r?.success){showAlert(alertEl,"✓ Assessment saved.","ok");setTimeout(()=>{closeModal("modal-assess");resetModal("modal-assess");loadAssessments();},1200);}
  else showAlert(alertEl,r?.message||"Error.");
});

loadDashboard();
</script>
</body>
</html>
