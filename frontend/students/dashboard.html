<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2>Student Portal</h2>
        <a href="portal.html">Home</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="../teachers/teachers.html">Teachers</a>
        <a href="../parents/parents.html">Parents</a>
    </aside>
    <main class="main">
        <header class="topbar">
            <h3>Student Dashboard</h3>
        </header>
        <section class="content">
            <div class="card">
                <h2>Welcome to your Dashboard</h2>
                <p>Here you can view your classes, assignments, and performance analytics.</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Current Grade</h3>
                    <h2>A</h2>
                </div>
                <div class="stat-card">
                    <h3>Attendance</h3>
                    <h2>98%</h2>
                </div>
                <div class="stat-card">
                    <h3>Assignments</h3>
                    <h2>12/12</h2>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
