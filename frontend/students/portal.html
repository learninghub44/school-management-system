<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CBC Portal</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>Student Portal</h2>

        <a href="../dashboard.html">Dashboard</a>
        <a href="portal.html" class="active">My CBC Progress</a>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <h3>My CBC Progress</h3>

            <span id="studentName"></span>

        </header>

        <section class="content">

            <!-- PROFILE -->
            <div class="card">

                <h2>My Profile</h2>

                <p><b>Name:</b> <span id="sName"></span></p>
                <p><b>Admission No:</b> <span id="sAdm"></span></p>
                <p><b>Grade:</b> <span id="sGrade"></span></p>

            </div>

            <!-- SUMMARY -->
            <div class="card">

                <h2>Performance Summary</h2>

                <p>EE: <span id="eeCount">0</span></p>
                <p>ME: <span id="meCount">0</span></p>
                <p>AE: <span id="aeCount">0</span></p>
                <p>BE: <span id="beCount">0</span></p>

            </div>

            <!-- TABLE -->
            <div class="table-container">

                <h2>My CBC Assessments</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Learning Area</th>
                            <th>Strand</th>
                            <th>Score</th>
                            <th>Comment</th>
                            <th>Teacher</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script type="module" src="../js/studentPortal.js"></script>

</body>
</html>
