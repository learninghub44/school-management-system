<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — Kadem &amp; Zetu SMS</title>
<script>
(function(){
  var t=localStorage.getItem('theme')||'system';
  var dark=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
})();
</script>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4338ca 100%);
  --card:#fff;--card-shadow:0 20px 50px rgba(0,0,0,.28);
  --text:#0f172a;--text-muted:#64748b;--text-hint:#94a3b8;
  --border:#e2e8f0;--input-bg:#fff;--focus-ring:rgba(79,70,229,.12);
}
[data-theme=dark]{
  --bg:linear-gradient(135deg,#0f0c29 0%,#1e1b4b 50%,#2d2a6e 100%);
  --card:#1e1b4b;--card-shadow:0 20px 50px rgba(0,0,0,.55);
  --text:#e2e8f0;--text-muted:#94a3b8;--text-hint:#64748b;
  --border:#312e81;--input-bg:#2d2a6e;--focus-ring:rgba(129,140,248,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border-radius:18px;padding:30px 32px;width:100%;max-width:360px;box-shadow:var(--card-shadow);position:relative}
.theme-toggle{position:absolute;top:14px;right:14px;display:flex;gap:2px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:2px}
.theme-btn{border:none;background:transparent;cursor:pointer;padding:4px 7px;border-radius:6px;font-size:12px;color:var(--text-muted)}
.theme-btn.active{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.logo{text-align:center;margin-bottom:22px}
.logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.logo-icon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo h1{font-size:16px;font-weight:800;color:var(--text)}
.logo p{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.fg{margin-bottom:13px}
.fg input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;color:var(--text);font-family:inherit;outline:none;background:var(--input-bg);transition:border-color .15s,box-shadow .15s}
.fg input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px var(--focus-ring)}
.fg input::placeholder{color:var(--text-hint)}
.captcha-wrap{margin:12px 0;display:flex;justify-content:center}
.btn-submit{width:100%;padding:12px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:10px;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(79,70,229,.32)}
.btn-submit:disabled{opacity:.65;cursor:not-allowed;transform:none}
.alert{padding:10px 13px;border-radius:9px;font-size:13px;margin-top:12px;font-weight:500;display:none}
.alert.show{display:block}
.alert-err{background:#fee2e2;color:#b91c1c}
.alert-ok{background:#dcfce7;color:#166534}
.foot{text-align:center;margin-top:18px;font-size:12.5px;color:var(--text-muted)}
.foot a{color:#4f46e5;font-weight:700;text-decoration:none}
.support-line{text-align:center;margin-top:14px;font-size:11.5px;color:var(--text-hint)}
.support-line a{color:var(--text-muted);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="theme-toggle">
    <button class="theme-btn" id="themeLight" onclick="setTheme('light')">☀️</button>
    <button class="theme-btn" id="themeSystem" onclick="setTheme('system')">⚙️</button>
    <button class="theme-btn" id="themeDark" onclick="setTheme('dark')">🌙</button>
  </div>

  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3.33 2 8.67 2 12 0v-5"/></svg>
    </div>
    <h1>Kadem &amp; Zetu SMS</h1>
    <p>Sign in to your school account</p>
  </div>

  <form id="loginForm">
    <div class="fg"><input id="school_code" type="text" placeholder="School Code" autocomplete="organization" maxlength="20" style="text-transform:uppercase"></div>
    <div class="fg"><input id="username" type="text" placeholder="Username or Email" autocomplete="username"></div>
    <div class="fg"><input id="password" type="password" placeholder="Password" autocomplete="current-password"></div>


    <div class="alert" id="message"></div>
    <button class="btn-submit" id="loginBtn" type="submit">Sign In</button>
  </form>

  <p class="foot">New school? <a href="/register.html">Register here</a></p>
  <p class="support-line">Need help? <a href="mailto:support@cbcerp.co.ke">support@cbcerp.co.ke</a> · <a href="tel:+254701059192">+254 701 059 192</a></p>
</div>

<script>

function setTheme(t){
  localStorage.setItem('theme',t);
  var dark=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  document.querySelectorAll('.theme-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('theme'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
}
(function(){
  var t=localStorage.getItem('theme')||'system';
  document.getElementById('theme'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
})();
</script>
<script type="module" src="/js/login.js"></script>
</body>
</html>
