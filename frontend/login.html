<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — CBC School ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4338ca 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:44px 40px;width:100%;max-width:440px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px}
.logo h1{font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px}
.logo p{font-size:13px;color:#64748b;margin-top:4px;font-weight:500}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11.5px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fg input{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;color:#0f172a;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
.fg input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fg input::placeholder{color:#cbd5e1}
.role-note{background:#f8fafc;border-radius:10px;padding:10px 14px;font-size:12px;color:#64748b;margin-bottom:18px;border:1px solid #e2e8f0}
.role-note span{font-weight:700;color:#4f46e5}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;position:relative}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn-submit:disabled{opacity:.7;cursor:not-allowed;transform:none}
.btn-submit.loading{color:transparent}
.btn-submit.loading::after{content:"";position:absolute;width:20px;height:20px;top:50%;left:50%;margin:-10px 0 0 -10px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:12px 16px;border-radius:10px;font-size:13.5px;margin-top:14px;font-weight:500;display:none}
.alert.show{display:block}
.alert-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.alert-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#94a3b8;font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e2e8f0}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <h1>CBC School ERP</h1>
    <p>Kenya Competency Based Curriculum</p>
  </div>

  <div class="fg">
    <label>School Code</label>
    <input id="school_code" type="text" placeholder="e.g. KPRI001" autocomplete="organization" maxlength="20" style="text-transform:uppercase">
  </div>
  <div class="role-note">Leave School Code blank if you are a <span>Super Admin</span></div>

  <div class="fg">
    <label>Username or Email</label>
    <input id="username" type="text" placeholder="username or email" autocomplete="username">
  </div>
  <div class="fg">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-submit" id="loginBtn">Sign In</button>
  <div class="alert alert-err" id="errMsg"></div>
  <div class="footer">CBC School ERP v4.0 · Powered by ZETU Business Solutions</div>
</div>

<script type="module">
import { auth, setSession, getUser, clearSession } from "/js/api.js";

// If already logged in, verify token is still valid before redirecting
// This prevents ERR_TOO_MANY_REDIRECTS from stale/expired sessions
const u = getUser();
if (u) {
  (async () => {
    try {
      const res = await auth.verify();
      if (res?.success) {
        const dest = { SUPER_ADMIN:"/super-admin.html", PRINCIPAL:"/school-admin.html",
          DEPUTY_PRINCIPAL:"/school-admin.html", HOD:"/school-admin.html",
          TEACHER:"/teacher.html", BURSAR:"/bursar.html" };
        window.location.href = dest[u.role] || "/school-admin.html";
      } else {
        // Token expired or invalid — clear it and stay on login
        clearSession();
      }
    } catch (_) {
      clearSession(); // Network error — stay on login, don't redirect
    }
  })();
}

const loginBtn = document.getElementById("loginBtn");
const errMsg   = document.getElementById("errMsg");

// ── Health check on load ─────────────────────────────────────────
(async () => {
  try {
    const BASE = window.API_BASE || "https://cbc-school-erp-api.onrender.com/api";
    const res = await fetch(BASE + "/health", { signal: AbortSignal.timeout(8000) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    // Backend is live — hide any lingering warning
  } catch (e) {
    errMsg.className  = "alert alert-warning";
    errMsg.textContent = "⚠️ Backend is starting up (Render free tier may take 30–60s). Retrying…";
    // Auto-retry after 10s
    setTimeout(() => { errMsg.textContent = ""; errMsg.className = "alert"; }, 10000);
  }
})();

async function doLogin() {
  const school_code = document.getElementById("school_code").value.trim().toUpperCase() || undefined;
  const username    = document.getElementById("username").value.trim();
  const password    = document.getElementById("password").value;
  errMsg.className  = "alert";

  if (!username || !password) {
    errMsg.textContent = "Username and password are required.";
    errMsg.classList.add("show","alert-err"); return;
  }

  loginBtn.disabled = true; loginBtn.classList.add("loading");
  const res = await auth.login({ username, password, school_code });
  loginBtn.disabled = false; loginBtn.classList.remove("loading");

  if (!res?.success) {
    errMsg.textContent = res?.message || "Login failed.";
    errMsg.classList.add("show","alert-err"); return;
  }

  setSession(res.token, res.user);

  if (res.must_change_password) {
    window.location.href = "/change-password.html"; return;
  }

  const dest = {
    SUPER_ADMIN:       "/super-admin.html",
    PRINCIPAL:         "/school-admin.html",
    DEPUTY_PRINCIPAL:  "/school-admin.html",
    HOD:               "/school-admin.html",
    TEACHER:           "/teacher.html",
    BURSAR:            "/bursar.html",
  };
  window.location.href = dest[res.user.role] || "/school-admin.html";
}

loginBtn.addEventListener("click", doLogin);
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
