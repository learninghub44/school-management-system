<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin – CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex}
.sidebar{width:230px;background:#1e293b;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid #334155}
.sb-brand{padding:20px;border-bottom:1px solid #334155}
.sb-brand h2{font-size:15px;font-weight:700;color:#f1f5f9}
.sb-brand p{font-size:11px;color:#64748b;margin-top:2px}
.nav{flex:1;padding:8px 0}
.nav-item{padding:10px 20px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;
  gap:10px;color:#94a3b8;border-left:3px solid transparent;transition:background-color 80ms ease,color 80ms ease,box-shadow 80ms ease}
.nav-item:hover{background:#334155;color:#f1f5f9}
.nav-item.active{background:#1d4ed820;color:#60a5fa;border-left-color:#3b82f6}
.sb-footer{padding:16px 20px;border-top:1px solid #334155}
.sb-footer .user{font-size:12px;color:#64748b;margin-bottom:8px}
.sb-footer .user strong{display:block;color:#94a3b8;font-size:13px}
button.logout{width:100%;padding:7px;background:#dc2626;border:none;color:#fff;border-radius:7px;
  cursor:pointer;font-size:12px;font-family:inherit}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1e293b;padding:14px 24px;border-bottom:1px solid #334155;
  display:flex;align-items:center;justify-content:space-between}
.topbar h3{font-size:17px;font-weight:700;color:#f1f5f9}
.content{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}.panel.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#1e293b;border-radius:12px;padding:18px;border:1px solid #334155}
.stat-card .val{font-size:30px;font-weight:700;color:#60a5fa}
.stat-card .lbl{font-size:12px;color:#64748b;margin-top:3px}
.card{background:#1e293b;border-radius:12px;border:1px solid #334155;overflow:hidden;margin-bottom:18px}
.card-hdr{padding:14px 18px;border-bottom:1px solid #334155;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-hdr h4{font-size:14px;font-weight:600;color:#f1f5f9}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0f172a;padding:9px 14px;text-align:left;font-weight:600;color:#64748b;
  border-bottom:1px solid #334155;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #1e293b;color:#cbd5e1}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1e293b80}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg-green{background:#166534;color:#86efac} .bg-red{background:#991b1b;color:#fca5a5}
.bg-blue{background:#1e3a8a;color:#93c5fd} .bg-yellow{background:#78350f;color:#fcd34d}
.btn{padding:7px 14px;border:none;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background-color 80ms ease,color 80ms ease,box-shadow 80ms ease}
.btn-blue{background:#1d4ed8;color:#fff}.btn-blue:hover{background:#1e40af}
.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-ghost{background:#334155;color:#94a3b8}.btn-ghost:hover{background:#475569}
.btn-sm{padding:4px 10px;font-size:11px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
  align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border-radius:14px;padding:24px;width:100%;max-width:460px;
  max-height:90vh;overflow-y:auto;border:1px solid #334155}
.modal h3{font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:18px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:8px 11px;background:#0f172a;border:1.5px solid #334155;
  border-radius:8px;font-size:13px;color:#e2e8f0;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#3b82f6}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.alert{padding:9px 13px;border-radius:7px;font-size:12px;margin-top:10px}
.ae{background:#7f1d1d;color:#fca5a5;border:1px solid #991b1b}
.as{background:#14532d;color:#86efac;border:1px solid #166534}
.empty{text-align:center;padding:36px;color:#475569;font-size:13px}
.scode{font-family:monospace;background:#0f172a;padding:2px 6px;border-radius:4px;
  font-size:12px;color:#60a5fa;border:1px solid #334155}

  /* ── Fast Responsive Buttons ──────────────────────────────────── */
  *{-webkit-tap-highlight-color:transparent}
  button,a[role=button],[role=button]{touch-action:manipulation}
  .btn,.btn-blue,.btn-green,.btn-red,.btn-amber,.btn-ghost,
  .btn-primary,.btn-ghost,.logout,button.logout,
  .nav-item,.tab,.tab-btn,.stab,.child-tab,.gb{
    transition:background-color 80ms ease,
               color 80ms ease,
               border-color 80ms ease,
               box-shadow 80ms ease,
               opacity 80ms ease;
    will-change:background-color;
    -webkit-user-select:none;user-select:none;
    cursor:pointer;
  }
  .btn:active,.btn-blue:active,.btn-green:active,
  .btn-red:active,.btn-amber:active,.btn-ghost:active,
  .btn-primary:active,.logout:active{
    transform:scale(0.97);
    transition:transform 50ms ease,background-color 50ms ease;
  }
  .btn:disabled,[disabled]{
    opacity:.55;cursor:not-allowed;pointer-events:none;
  }
  /* Loading spinner */
  .btn-loading{position:relative;color:transparent!important}
  .btn-loading::after{
    content:"";position:absolute;width:16px;height:16px;
    top:50%;left:50%;margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;
    animation:btn-spin .6s linear infinite;
  }
  @keyframes btn-spin{to{transform:rotate(360deg)}}
  .btn-loading.btn-ghost::after{
    border-color:rgba(0,0,0,.15);border-top-color:#374151;
  }

</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-brand"><h2>🏛 CBC School ERP</h2><p>Super Admin Console</p></div>
  <nav class="nav">
    <div class="nav-item active" data-p="overview">📊 Overview</div>
    <div class="nav-item" data-p="schools">🏫 Schools</div>
    <div class="nav-item" data-p="admins">👤 School Admins</div>
  </nav>
  <div class="sb-footer">
    <div class="user"><strong id="saName">Loading…</strong>Super Admin</div>
    <button class="logout" id="logoutBtn">Sign Out</button>
  </div>
</aside>
<div class="main">
  <header class="topbar"><h3 id="pageTitle">Overview</h3><span style="font-size:12px;color:#64748b" id="topInfo"></span></header>
  <div class="content">

    <!-- OVERVIEW -->
    <div class="panel active" id="panel-overview">
      <div class="stat-grid">
        <div class="stat-card"><div class="val" id="s-total">–</div><div class="lbl">Total Schools</div></div>
        <div class="stat-card"><div class="val" id="s-active">–</div><div class="lbl">Active Schools</div></div>
        <div class="stat-card"><div class="val" id="s-inactive">–</div><div class="lbl">Inactive Schools</div></div>
        <div class="stat-card"><div class="val" id="s-admins">–</div><div class="lbl">School Admins</div></div>
      </div>
      <div class="card">
        <div class="card-hdr"><h4>All Schools</h4><button class="btn btn-blue" id="ov-addSchool">+ New School</button></div>
        <div id="ovSchools" class="empty">Loading…</div>
      </div>
    </div>

    <!-- SCHOOLS -->
    <div class="panel" id="panel-schools">
      <div class="card">
        <div class="card-hdr"><h4>Manage Schools</h4><button class="btn btn-blue" id="addSchoolBtn">+ New School</button></div>
        <div id="schoolsList" class="empty">Loading…</div>
      </div>
    </div>

    <!-- ADMINS -->
    <div class="panel" id="panel-admins">
      <div class="card">
        <div class="card-hdr"><h4>School Administrators</h4><button class="btn btn-blue" id="addAdminBtn">+ Add Admin</button></div>
        <div id="adminsList" class="empty">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: School -->
<div class="modal-bg" id="schoolModal">
  <div class="modal">
    <h3>Create School</h3>
    <div class="fg"><label>School Name *</label><input id="m-sName" placeholder="Nakuru Primary School"></div>
    <div class="fg-row">
      <div class="fg"><label>School Code * (unique)</label><input id="m-sCode" placeholder="NKR-001" style="text-transform:uppercase"></div>
      <div class="fg"><label>Level</label>
        <select id="m-sLevel">
          <option value="Primary">Primary</option>
          <option value="ECDE">ECDE</option>
          <option value="Junior Secondary">Junior Secondary</option>
          <option value="Senior Secondary">Senior Secondary</option>
        </select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>County</label><input id="m-sCounty" placeholder="Nakuru"></div>
      <div class="fg"><label>Sub-County</label><input id="m-sSubC" placeholder="Nakuru East"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Email</label><input id="m-sEmail" type="email" placeholder="school@edu.ac.ke"></div>
      <div class="fg"><label>Phone</label><input id="m-sPhone" placeholder="0712345678"></div>
    </div>
    <div id="schoolAlert"></div>
    <div class="ma">
      <button class="btn btn-ghost" onclick="closeModal('schoolModal')">Cancel</button>
      <button class="btn btn-blue" id="saveSchool">Create School</button>
    </div>
  </div>
</div>

<!-- MODAL: Admin -->
<div class="modal-bg" id="adminModal">
  <div class="modal">
    <h3>Add School Admin</h3>
    <div class="fg"><label>School *</label><select id="m-aSchool"><option value="">Select school…</option></select></div>
    <div class="fg"><label>Full Name *</label><input id="m-aName" placeholder="Jane Doe"></div>
    <div class="fg"><label>Email *</label><input id="m-aEmail" type="email" placeholder="admin@school.ac.ke"></div>
    <div class="fg-row">
      <div class="fg"><label>Phone</label><input id="m-aPhone" placeholder="0712345678"></div>
      <div class="fg"><label>Password * (min 8 chars)</label><input id="m-aPass" type="password" placeholder="••••••••"></div>
    </div>
    <div id="adminAlert"></div>
    <div class="ma">
      <button class="btn btn-ghost" onclick="closeModal('adminModal')">Cancel</button>
      <button class="btn btn-blue" id="saveAdmin">Create Admin</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage, logout, schools, users } from "./js/api.js";
const me = guardPage(["SUPER_ADMIN"]);
document.getElementById("saName").textContent = me.name;
document.getElementById("topInfo").textContent = me.email;

let allSchools = [], allAdmins = [];

// ── Nav ────────────────────────────────────────────────────────────────────────
document.querySelectorAll(".nav-item").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("panel-"+el.dataset.p).classList.add("active");
    document.getElementById("pageTitle").textContent = el.textContent.trim();
    if (el.dataset.p === "admins") renderAdmins();
  });
});
document.getElementById("logoutBtn").addEventListener("click", async (e) => {
  const b = e.currentTarget; b.disabled=true; b.classList.add("btn-loading");
  await logout();
});

// ── Load ───────────────────────────────────────────────────────────────────────
async function loadAll() {
  const [sr, ur] = await Promise.all([schools.list(), users.list({ role:"SCHOOL_ADMIN" })]);
  allSchools = sr?.data || [];
  allAdmins  = ur?.data || [];
  renderOverview(); renderSchools();
}

function statusBadge(active) {
  return `<span class="badge ${active?"bg-green":"bg-red"}">${active?"Active":"Inactive"}</span>`;
}

function renderOverview() {
  document.getElementById("s-total").textContent   = allSchools.length;
  document.getElementById("s-active").textContent  = allSchools.filter(s=>s.is_active).length;
  document.getElementById("s-inactive").textContent= allSchools.filter(s=>!s.is_active).length;
  document.getElementById("s-admins").textContent  = allAdmins.length;
  renderSchoolTable("ovSchools");
}

function renderSchools() { renderSchoolTable("schoolsList"); }

function renderSchoolTable(elId) {
  const el = document.getElementById(elId);
  if (!allSchools.length) { el.innerHTML="<div class='empty'>No schools yet.</div>"; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Code</th><th>Level</th><th>County</th><th>Students</th><th>Staff</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${allSchools.map(s => `<tr>
      <td><strong>${s.name}</strong></td>
      <td><span class="scode">${s.school_code}</span></td>
      <td>${s.level||"–"}</td>
      <td>${s.county||"–"}</td>
      <td>${s.student_count||0}</td>
      <td>${s.staff_count||0}</td>
      <td>${statusBadge(s.is_active)}</td>
      <td style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="btn btn-sm btn-blue" onclick="openAddAdmin('${s.id}','${s.name}')">+ Admin</button>
        ${s.is_active
          ? `<button class="btn btn-sm btn-red"   onclick="toggleSchool('${s.id}','${s.name}',false)">Deactivate</button>`
          : `<button class="btn btn-sm btn-green" onclick="toggleSchool('${s.id}','${s.name}',true)">Activate</button>`
        }
      </td>
    </tr>`).join("")}</tbody></table>`;
}

function renderAdmins() {
  const el = document.getElementById("adminsList");
  if (!allAdmins.length) { el.innerHTML="<div class='empty'>No admins yet.</div>"; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Email</th><th>School</th><th>Phone</th><th>Status</th><th></th></tr></thead>
    <tbody>${allAdmins.map(a => {
      const sc = allSchools.find(s=>s.id===a.school_id);
      return `<tr>
        <td><strong>${a.name}</strong></td>
        <td>${a.email}</td>
        <td>${sc ? `<span class="scode">${sc.school_code}</span> ${sc.name}` : "–"}</td>
        <td>${a.phone||"–"}</td>
        <td>${statusBadge(a.is_active)}</td>
        <td style="display:flex;gap:5px">
          ${a.is_active
            ? `<button class="btn btn-sm btn-red" onclick="toggleAdmin('${a.id}','${a.name}',false)">Deactivate</button>`
            : `<button class="btn btn-sm btn-green" onclick="toggleAdmin('${a.id}','${a.name}',true)">Activate</button>`
          }
          <button class="btn btn-sm btn-ghost" onclick="resetAdminPassword('${a.id}','${a.name}')">Reset PW</button>
        </td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

// ── School CRUD ────────────────────────────────────────────────────────────────
["addSchoolBtn","ov-addSchool"].forEach(id => {
  document.getElementById(id)?.addEventListener("click", () => {
    ["m-sName","m-sCode","m-sCounty","m-sSubC","m-sEmail","m-sPhone"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("schoolAlert").innerHTML="";
    document.getElementById("schoolModal").classList.add("open");
  });
});

document.getElementById("saveSchool").addEventListener("click", async () => {
  const name=document.getElementById("m-sName").value.trim();
  const school_code=document.getElementById("m-sCode").value.trim().toUpperCase();
  const level=document.getElementById("m-sLevel").value;
  const county=document.getElementById("m-sCounty").value.trim();
  const sub_county=document.getElementById("m-sSubC").value.trim();
  const email=document.getElementById("m-sEmail").value.trim();
  const phone=document.getElementById("m-sPhone").value.trim();
  if (!name||!school_code) { setAlert("schoolAlert","Name and code required."); return; }
  const res = await schools.create({ name, school_code, level, county, sub_county, email, phone });
  if (!res?.success) { setAlert("schoolAlert", res?.message||"Failed."); return; }
  setAlert("schoolAlert","School created!","as");
  setTimeout(() => { closeModal("schoolModal"); loadAll(); }, 700);
});

window.toggleSchool = async (id, name, activate) => {
  const action = activate ? "Activate" : "Deactivate";
  if (!confirm(`${action} "${name}"?`)) return;
  const res = await schools.setStatus(id, activate);
  if (res?.success) loadAll();
  else alert(res?.message||"Failed.");
};

// ── Admin CRUD ─────────────────────────────────────────────────────────────────
window.openAddAdmin = (schoolId, schoolName) => {
  const sel = document.getElementById("m-aSchool");
  sel.innerHTML = `<option value="">Select school…</option>` +
    allSchools.filter(s=>s.is_active).map(s=>`<option value="${s.id}" ${s.id===schoolId?"selected":""}>${s.name} (${s.school_code})</option>`).join("");
  ["m-aName","m-aEmail","m-aPhone","m-aPass"].forEach(i=>document.getElementById(i).value="");
  document.getElementById("adminAlert").innerHTML="";
  document.getElementById("adminModal").classList.add("open");
};

document.getElementById("addAdminBtn").addEventListener("click", () => window.openAddAdmin(null));

document.getElementById("saveAdmin").addEventListener("click", async () => {
  const schoolId=document.getElementById("m-aSchool").value;
  const name=document.getElementById("m-aName").value.trim();
  const email=document.getElementById("m-aEmail").value.trim();
  const phone=document.getElementById("m-aPhone").value.trim();
  const password=document.getElementById("m-aPass").value;
  if (!schoolId||!name||!email||!password) { setAlert("adminAlert","All fields required."); return; }
  if (password.length<8) { setAlert("adminAlert","Password min 8 chars."); return; }
  const res = await schools.createAdmin(schoolId, { name, email, phone, password });
  if (!res?.success) { setAlert("adminAlert", res?.message||"Failed."); return; }
  setAlert("adminAlert","Admin created!","as");
  setTimeout(() => { closeModal("adminModal"); loadAll(); }, 700);
});

window.toggleAdmin = async (id, name, activate) => {
  const action = activate ? "Activate" : "Deactivate";
  if (!confirm(`${action} admin "${name}"?`)) return;
  const res = await users.update(id, { is_active: activate });
  if (res?.success) loadAll();
  else alert(res?.message || "Failed.");
};

window.resetAdminPassword = async (id, name) => {
  const pw = prompt(`New password for "${name}" (min 8 chars):`);
  if (!pw) return;
  if (pw.length < 8) { alert("Password must be at least 8 characters."); return; }
  const res = await users.resetPassword(id, pw);
  if (res?.success) alert(`Password reset for ${name}.`);
  else alert(res?.message || "Failed.");
};

// ── Helpers ────────────────────────────────────────────────────────────────────
window.closeModal = id => document.getElementById(id).classList.remove("open");
function setAlert(el, msg, cls="ae") { document.getElementById(el).innerHTML=`<div class="alert ${cls}">${msg}</div>`; }

loadAll();
</script>
</body>
</html>
