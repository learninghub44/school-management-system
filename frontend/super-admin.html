<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin — CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<div id="app"></div>

<div class="modal-bg" id="modal-school">
<div class="modal">
  <div class="modal-hdr"><h3>Register New School</h3><button class="modal-close" data-close="modal-school">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>School Name *</label><input id="sc-name" maxlength="255"></div>
    <div class="fg"><label>School Code *</label><input id="sc-code" maxlength="20" placeholder="e.g. KPRI001" style="text-transform:uppercase"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Level *</label>
      <select id="sc-level"><option value="ECDE">ECDE</option><option value="Primary" selected>Primary</option><option value="Junior Secondary">Junior Secondary</option><option value="Senior Secondary">Senior Secondary</option><option value="Mixed">Mixed</option></select>
    </div>
    <div class="fg"><label>Current Term</label>
      <select id="sc-term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>County</label><input id="sc-county" maxlength="100"></div>
    <div class="fg"><label>Sub-County</label><input id="sc-subcounty" maxlength="100"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Phone</label><input id="sc-phone" type="tel" maxlength="20"></div>
    <div class="fg"><label>Email</label><input id="sc-email" type="email" maxlength="255"></div>
  </div>
  <div class="fg"><label>Address</label><textarea id="sc-addr" maxlength="300"></textarea></div>
  <div class="fg"><label>Academic Year</label><input id="sc-year" maxlength="4" value="2025"></div>
  <div id="sc-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-school">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitSchool">Register School</button>
  </div>
</div></div>

<div class="modal-bg" id="modal-admin">
<div class="modal">
  <div class="modal-hdr"><h3>Create School User</h3><button class="modal-close" data-close="modal-admin">×</button></div>
  <div class="fg"><label>School *</label><select id="adm-school"><option value="">Select School</option></select></div>
  <div class="fg-row">
    <div class="fg"><label>Full Name *</label><input id="adm-name" maxlength="150"></div>
    <div class="fg"><label>Phone</label><input id="adm-phone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg"><label>Username *</label><input id="adm-username" maxlength="50"></div>
  <div class="fg"><label>Email *</label><input id="adm-email" type="email" maxlength="150"></div>
  <div class="fg"><label>Role *</label>
    <select id="adm-role">
      <option value="PRINCIPAL">Principal</option>
      <option value="DEPUTY_PRINCIPAL">Deputy Principal</option>
      <option value="BURSAR">Bursar</option>
      <option value="HOD">HOD</option>
      <option value="TEACHER">Teacher</option>
    </select>
  </div>
  <div class="fg"><label>Temporary Password *</label><input id="adm-pass" type="password" minlength="8" maxlength="72" placeholder="Min 8 chars, A-Z a-z 0-9"></div>
  <div id="adm-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-admin">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAdmin">Create User</button>
  </div>
</div></div>

<script type="module">
import { guardPage, esc, apiFetch, clearSession, schools, users, verifySession } from "/js/api.js";
import { SHARED_CSS, buildSidebar, setupNav, openModal, closeModal, resetModal, showAlert, setLoading, injectStyles } from "/js/layout.js";
injectStyles();

let me = guardPage(["SUPER_ADMIN"]);
if (!me) throw new Error();
const vRes = await verifySession();
if (vRes.reason === "auth") { clearSession(); location.href="/login.html"; return; }
if (vRes.ok) me = vRes.user;
// If network error: keep going with session data — don't force logout

let allSchools = [];

const NAV = [
  { panel:"overview", icon:"📊", label:"Dashboard" },
  { panel:"schools",  icon:"🏫", label:"Schools" },
  { panel:"users",    icon:"👤", label:"School Users" },
  { panel:"audit",    icon:"🔎", label:"Audit Log" },
];

document.getElementById("app").innerHTML = `
${buildSidebar(NAV,"overview")}
<div class="main">
  <header class="topbar">
    <h3 id="pageTitle">Dashboard</h3>
    <div class="topbar-right">Super Admin · ${esc(me.email)}</div>
  </header>
  <div class="content">
    <div class="panel active" id="panel-overview">
      <div class="stat-grid" id="statsGrid"><div class="empty">Loading…</div></div>
      <div class="card"><div class="card-hdr"><h4>All Schools</h4></div>
        <div class="card-body"><div class="table-wrap" id="dashSchoolsTbl"><div class="empty">Loading…</div></div></div>
      </div>
    </div>
    <div class="panel" id="panel-schools">
      <div class="card">
        <div class="card-hdr"><h4>Registered Schools</h4><button class="btn btn-primary" id="btnAddSchool">+ Register School</button></div>
        <div class="card-body">
          <div class="filter-bar"><input type="text" id="filterSchool" placeholder="Search name or code…" style="flex:1;min-width:200px"></div>
          <div class="table-wrap" id="schoolsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-users">
      <div class="card">
        <div class="card-hdr"><h4>School Users</h4><button class="btn btn-primary" id="btnAddAdmin">+ Create User</button></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterUserSchool"><option value="">All Schools</option></select>
            <select id="filterUserRole"><option value="">All Roles</option>
              <option value="PRINCIPAL">Principal</option><option value="DEPUTY_PRINCIPAL">Deputy Principal</option>
              <option value="HOD">HOD</option><option value="TEACHER">Teacher</option><option value="BURSAR">Bursar</option>
            </select>
          </div>
          <div class="table-wrap" id="usersTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-audit">
      <div class="card"><div class="card-hdr"><h4>Audit Log</h4></div>
        <div class="card-body"><div class="table-wrap" id="auditTbl"><div class="empty">Loading…</div></div></div>
      </div>
    </div>
  </div>
</div>`;

setupNav({ overview:loadDashboard, schools:loadSchools, users:loadUsers, audit:loadAudit });
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal-bg").forEach(bg=>bg.addEventListener("click",e=>{if(e.target===bg)closeModal(bg.id);}));

async function fetchSchools() {
  const r = await schools.list();
  allSchools = r?.data || [];
  ["adm-school","filterUserSchool"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    const isFilter=id.startsWith("filter");
    el.innerHTML=(isFilter?'<option value="">All Schools</option>':'<option value="">Select School</option>')+
      allSchools.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.school_code)})</option>`).join("");
  });
}
await fetchSchools();

async function loadDashboard() {
  const total=allSchools.length, active=allSchools.filter(s=>s.is_active).length;
  const studs=allSchools.reduce((a,s)=>a+(s.student_count||0),0);
  const staff=allSchools.reduce((a,s)=>a+(s.staff_count||0),0);
  document.getElementById("statsGrid").innerHTML=`
    <div class="stat-card"><div class="val">${esc(String(total))}</div><div class="lbl">Total Schools</div><div class="sub">${esc(String(active))} active</div></div>
    <div class="stat-card"><div class="val">${esc(String(studs))}</div><div class="lbl">Total Students</div></div>
    <div class="stat-card"><div class="val">${esc(String(staff))}</div><div class="lbl">Total Staff</div></div>`;
  renderSchools(allSchools.slice(0,8),"dashSchoolsTbl",true);
}

function renderSchools(data,tblId,compact=false){
  const tbl=document.getElementById(tblId);
  if(!data.length){tbl.innerHTML='<div class="empty">No schools found</div>';return;}
  tbl.innerHTML=`<table><thead><tr><th>School</th><th>Code</th><th>Level</th><th>County</th><th>Students</th><th>Staff</th><th>Term/Year</th><th>Status</th>${compact?"":"<th>Actions</th>"}</tr></thead><tbody>
    ${data.map(s=>`<tr>
      <td><strong>${esc(s.name)}</strong>${s.email?`<br><span style="font-size:11px;color:#94a3b8">${esc(s.email)}</span>`:""}</td>
      <td><code style="font-size:12px;font-weight:700">${esc(s.school_code)}</code></td>
      <td><span class="badge bgray">${esc(s.level||"Primary")}</span></td>
      <td>${esc(s.county||"–")}</td>
      <td>${esc(String(s.student_count||0))}</td>
      <td>${esc(String(s.staff_count||0))}</td>
      <td>T${esc(String(s.current_term||1))} / ${esc(s.academic_year||"–")}</td>
      <td><span class="badge ${s.is_active?"bg":"br"}">${s.is_active?"Active":"Inactive"}</span></td>
      ${compact?"":
        `<td><button class="btn btn-sm ${s.is_active?"btn-danger":"btn-success"}" data-act="toggle-school" data-id="${esc(s.id)}">${s.is_active?"Deactivate":"Activate"}</button></td>`}
    </tr>`).join("")}
  </tbody></table>`;
  if(!compact){
    tbl.querySelectorAll("[data-act='toggle-school']").forEach(b=>b.addEventListener("click",async()=>{
      const r=await schools.toggle(b.dataset.id);
      if(r?.success){await fetchSchools();loadSchools();loadDashboard();}
      else alert(r?.message||"Error.");
    }));
  }
}

async function loadSchools(){
  const q=document.getElementById("filterSchool").value.toLowerCase();
  const filtered=q?allSchools.filter(s=>(s.name+" "+s.school_code).toLowerCase().includes(q)):allSchools;
  renderSchools(filtered,"schoolsTbl",false);
}
document.getElementById("filterSchool").addEventListener("input",loadSchools);

async function loadUsers(){
  document.getElementById("usersTbl").innerHTML='<div class="empty">Loading…</div>';
  const sid=document.getElementById("filterUserSchool").value;
  const role=document.getElementById("filterUserRole").value;
  const r=await users.list({school_id:sid||undefined,role:role||undefined});
  const data=r?.data||[];
  if(!data.length){document.getElementById("usersTbl").innerHTML='<div class="empty">No users found</div>';return;}
  const rmap={PRINCIPAL:"bb",DEPUTY_PRINCIPAL:"bpurple",HOD:"bteal",TEACHER:"bg",BURSAR:"by"};
  document.getElementById("usersTbl").innerHTML=`<table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>School</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${data.map(u=>`<tr>
      <td><strong>${esc(u.name)}</strong><br><span style="font-size:11.5px;color:#94a3b8">${esc(u.email)}</span></td>
      <td><code style="font-size:12px">${esc(u.username)}</code></td>
      <td><span class="badge ${rmap[u.role]||"bgray"}">${esc(u.role)}</span></td>
      <td>${esc(u.school_name||"–")}</td>
      <td style="font-size:12px">${u.last_login?new Date(u.last_login).toLocaleDateString("en-KE"):"Never"}</td>
      <td><span class="badge ${u.is_active?"bg":"br"}">${u.is_active?"Active":"Inactive"}</span></td>
      <td><div class="action-btns">
        <button class="btn btn-sm btn-warn" data-act="tog" data-id="${esc(u.id)}" data-active="${u.is_active}">${u.is_active?"Deactivate":"Activate"}</button>
        <button class="btn btn-sm btn-ghost" data-act="rpw" data-id="${esc(u.id)}" data-name="${esc(u.name)}">Reset PW</button>
      </div></td>
    </tr>`).join("")}
  </tbody></table>`;
  document.querySelectorAll("[data-act='tog']").forEach(b=>b.addEventListener("click",async()=>{
    const r=await users.update(b.dataset.id,{is_active:b.dataset.active!=="true"});
    if(r?.success)loadUsers(); else alert(r?.message||"Error.");
  }));
  document.querySelectorAll("[data-act='rpw']").forEach(b=>b.addEventListener("click",async()=>{
    const pw=prompt(`Reset password for ${b.dataset.name}\nMin 8 chars, must have uppercase, lowercase and number:`);
    if(!pw||pw.length<8){if(pw!==null)alert("Password too short.");return;}
    const r=await users.resetPassword(b.dataset.id,pw);
    alert(r?.message||(r?.success?"Password reset.":"Error."));
  }));
}
document.getElementById("filterUserSchool").addEventListener("change",loadUsers);
document.getElementById("filterUserRole").addEventListener("change",loadUsers);

async function loadAudit(){
  document.getElementById("auditTbl").innerHTML='<div class="empty">Loading…</div>';
  const r=await apiFetch("/auth/audit-log");
  const data=r?.data||[];
  if(!data.length){document.getElementById("auditTbl").innerHTML='<div class="empty">No audit records</div>';return;}
  document.getElementById("auditTbl").innerHTML=`<table><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Resource</th><th>IP</th><th>Result</th></tr></thead><tbody>
    ${data.map(l=>`<tr>
      <td style="font-size:12px;white-space:nowrap">${new Date(l.created_at).toLocaleString("en-KE")}</td>
      <td style="font-size:12.5px">${esc(l.user_name||"System")}</td>
      <td><span class="badge bgray" style="font-size:10px">${esc(l.user_role||"–")}</span></td>
      <td><strong style="font-size:12.5px">${esc(l.action)}</strong></td>
      <td style="font-size:12px">${esc(l.resource_type||"–")}${l.resource_id?` #${esc(l.resource_id)}`:""}</td>
      <td style="font-size:11px;color:#94a3b8">${esc(l.ip_address||"–")}</td>
      <td><span class="badge ${l.outcome==="SUCCESS"?"bg":"br"}">${esc(l.outcome||"–")}</span></td>
    </tr>`).join("")}
  </tbody></table>`;
}

document.getElementById("btnAddSchool").addEventListener("click",()=>openModal("modal-school"));
document.getElementById("btnAddAdmin").addEventListener("click",()=>openModal("modal-admin"));

document.getElementById("btnSubmitSchool").addEventListener("click",async()=>{
  const name=document.getElementById("sc-name").value.trim();
  const code=document.getElementById("sc-code").value.trim().toUpperCase();
  const alertEl=document.getElementById("sc-alert");
  if(!name||!code) return showAlert(alertEl,"School name and code are required.");
  if(!/^[A-Z0-9]{2,20}$/.test(code)) return showAlert(alertEl,"Code must be 2–20 uppercase letters/numbers only.");
  setLoading("btnSubmitSchool",true);
  const r=await schools.create({
    name, school_code:code,
    level:document.getElementById("sc-level").value,
    current_term:parseInt(document.getElementById("sc-term").value),
    county:document.getElementById("sc-county").value.trim()||null,
    sub_county:document.getElementById("sc-subcounty").value.trim()||null,
    phone:document.getElementById("sc-phone").value.trim()||null,
    email:document.getElementById("sc-email").value.trim()||null,
    address:document.getElementById("sc-addr").value.trim()||null,
    academic_year:document.getElementById("sc-year").value.trim()||"2025",
  });
  setLoading("btnSubmitSchool",false);
  if(r?.success){showAlert(alertEl,"✓ School registered.","ok");setTimeout(()=>{closeModal("modal-school");resetModal("modal-school");fetchSchools();loadSchools();loadDashboard();},1400);}
  else showAlert(alertEl,r?.message||"Error.");
});

document.getElementById("btnSubmitAdmin").addEventListener("click",async()=>{
  const schoolId=document.getElementById("adm-school").value;
  const name=document.getElementById("adm-name").value.trim();
  const username=document.getElementById("adm-username").value.trim();
  const email=document.getElementById("adm-email").value.trim();
  const role=document.getElementById("adm-role").value;
  const pass=document.getElementById("adm-pass").value;
  const alertEl=document.getElementById("adm-alert");
  if(!schoolId||!name||!username||!email||!role||!pass) return showAlert(alertEl,"All fields required.");
  if(pass.length<8) return showAlert(alertEl,"Password must be at least 8 characters.");
  setLoading("btnSubmitAdmin",true);
  const r=await users.create({school_id:schoolId,name,username,email,role,password:pass,phone:document.getElementById("adm-phone").value.trim()||null});
  setLoading("btnSubmitAdmin",false);
  if(r?.success){showAlert(alertEl,"✓ User created. Must change password on first login.","ok");setTimeout(()=>{closeModal("modal-admin");resetModal("modal-admin");loadUsers();},1400);}
  else showAlert(alertEl,r?.message||"Error.");
});

loadDashboard();
</script>
</body>
</html>
