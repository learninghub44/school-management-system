<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard – CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f5f9;min-height:100vh;display:flex}
.sidebar{width:220px;background:linear-gradient(180deg,#78350f,#92400e);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sb-brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.15)}
.sb-brand h2{font-size:14px;font-weight:700}
.sb-brand p{font-size:11px;opacity:.7;margin-top:2px}
.sb-school{margin:12px 16px;background:rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;font-size:11px}
.sb-school strong{display:block;font-size:12px;margin-top:1px}
.nav{flex:1;padding:8px 0}
.nav-item{padding:10px 18px;cursor:pointer;font-size:13px;display:flex;align-items:center;
  gap:9px;color:rgba(255,255,255,.7);border-left:3px solid transparent;transition:background-color 80ms ease,color 80ms ease,box-shadow 80ms ease}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;border-left-color:#fbbf24}
.sb-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.15)}
.sb-footer .uname{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:6px}
.sb-footer button{width:100%;padding:7px;background:rgba(255,255,255,.2);border:none;
  color:#fff;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;padding:14px 24px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.topbar h3{font-size:17px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}.panel.active{display:block}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .val{font-size:26px;font-weight:700;color:#92400e}
.stat-card .lbl{font-size:12px;color:#6b7280;margin-top:3px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:18px}
.card-hdr{padding:14px 18px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-hdr h4{font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#fafafa;padding:9px 14px;text-align:left;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}
td{padding:10px 14px;border-bottom:1px solid #f3f4f6;color:#374151}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fffbeb}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:#dcfce7;color:#16a34a} .b-red{background:#fee2e2;color:#dc2626}
.b-blue{background:#dbeafe;color:#1d4ed8} .b-yellow{background:#fef9c3;color:#854d0e}
.btn{padding:7px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-amber{background:#d97706;color:#fff}.btn-amber:hover{background:#b45309}
.btn-ghost{background:#f1f5f9;color:#374151}.btn-ghost:hover{background:#e2e8f0}
.btn-sm{padding:4px 10px;font-size:11px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 11px;border:1.5px solid #e5e7eb;
  border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#d97706}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.alert{padding:9px 12px;border-radius:7px;font-size:12px;margin-top:10px}
.ae{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.as{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.empty{text-align:center;padding:36px;color:#9ca3af;font-size:13px}
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-row select,.filter-row input{padding:7px 10px;border:1.5px solid #e5e7eb;
  border-radius:7px;font-size:12px;outline:none;font-family:inherit}

  /* ── Fast Responsive Buttons ──────────────────────────────────── */
  *{-webkit-tap-highlight-color:transparent}
  button,a[role=button],[role=button]{touch-action:manipulation}
  .btn,.btn-blue,.btn-green,.btn-red,.btn-amber,.btn-ghost,
  .btn-primary,.btn-ghost,.logout,button.logout,
  .nav-item,.tab,.tab-btn,.stab,.child-tab,.gb{
    transition:background-color 80ms ease,
               color 80ms ease,
               border-color 80ms ease,
               box-shadow 80ms ease,
               opacity 80ms ease;
    will-change:background-color;
    -webkit-user-select:none;user-select:none;
    cursor:pointer;
  }
  .btn:active,.btn-blue:active,.btn-green:active,
  .btn-red:active,.btn-amber:active,.btn-ghost:active,
  .btn-primary:active,.logout:active{
    transform:scale(0.97);
    transition:transform 50ms ease,background-color 50ms ease;
  }
  .btn:disabled,[disabled]{
    opacity:.55;cursor:not-allowed;pointer-events:none;
  }
  /* Loading spinner */
  .btn-loading{position:relative;color:transparent!important}
  .btn-loading::after{
    content:"";position:absolute;width:16px;height:16px;
    top:50%;left:50%;margin:-8px 0 0 -8px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;
    animation:btn-spin .6s linear infinite;
  }
  @keyframes btn-spin{to{transform:rotate(360deg)}}
  .btn-loading.btn-ghost::after{
    border-color:rgba(0,0,0,.15);border-top-color:#374151;
  }

</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-brand"><h2>💰 Finance</h2><p>CBC School ERP</p></div>
  <div class="sb-school"><span style="opacity:.7;font-size:10px">School</span><strong id="schoolName">Loading…</strong></div>
  <nav class="nav">
    <div class="nav-item active" data-p="overview">📊 Overview</div>
    <div class="nav-item" data-p="payments">💳 Payments</div>
    <div class="nav-item" data-p="fees">📋 Fee Structures</div>
  </nav>
  <div class="sb-footer">
    <div class="uname" id="uname">Loading…</div>
    <button id="logoutBtn">Sign Out</button>
  </div>
</aside>
<div class="main">
  <header class="topbar"><h3 id="pageTitle">Overview</h3></header>
  <div class="content">

    <div class="panel active" id="panel-overview">
      <div class="stat-grid" id="summaryStats">
        <div class="stat-card"><div class="val" id="sv-total">–</div><div class="lbl">Total Revenue</div></div>
        <div class="stat-card"><div class="val" id="sv-t1">–</div><div class="lbl">Term 1</div></div>
        <div class="stat-card"><div class="val" id="sv-t2">–</div><div class="lbl">Term 2</div></div>
        <div class="stat-card"><div class="val" id="sv-t3">–</div><div class="lbl">Term 3</div></div>
      </div>
      <div class="card">
        <div class="card-hdr"><h4>Recent Payments</h4><button class="btn btn-amber" id="ov-recordPayment">+ Record Payment</button></div>
        <div id="recentPayments" class="empty">Loading…</div>
      </div>
    </div>

    <div class="panel" id="panel-payments">
      <div class="card">
        <div class="card-hdr">
          <h4>All Payments</h4>
          <div class="filter-row">
            <select id="filterTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
            <input type="number" id="filterYear" placeholder="Year" value="2025" style="width:80px">
            <button class="btn btn-ghost btn-sm" id="applyFilter">Filter</button>
            <button class="btn btn-amber" id="recordPaymentBtn">+ Record Payment</button>
          </div>
        </div>
        <div id="paymentsList" class="empty">Loading…</div>
      </div>
    </div>

    <div class="panel" id="panel-fees">
      <div class="card">
        <div class="card-hdr"><h4>Fee Structures</h4><button class="btn btn-amber" id="addFeeBtn">+ Add Fee</button></div>
        <div id="feesList" class="empty">Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Record Payment -->
<div class="modal-bg" id="payModal">
  <div class="modal">
    <h3>Record Payment</h3>
    <div class="fg"><label>Student *</label><select id="p-student"><option value="">Select student…</option></select></div>
    <div class="fg-row">
      <div class="fg"><label>Amount (KES) *</label><input type="number" id="p-amount" min="1" placeholder="5000"></div>
      <div class="fg"><label>Method *</label>
        <select id="p-method"><option value="">–</option><option value="MPESA">M-Pesa</option>
          <option value="BANK">Bank Transfer</option><option value="CASH">Cash</option><option value="CHEQUE">Cheque</option></select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Term *</label>
        <select id="p-term"><option value="">–</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
      </div>
      <div class="fg"><label>Year *</label><input type="number" id="p-year" min="2020"></div>
    </div>
    <div class="fg"><label>Reference (M-Pesa code / receipt)</label><input id="p-ref" placeholder="e.g. QAB12345CD"></div>
    <div class="fg"><label>Notes</label><textarea id="p-notes" rows="2" placeholder="Optional…"></textarea></div>
    <div id="payAlert"></div>
    <div class="ma">
      <button class="btn btn-ghost" onclick="closeModal('payModal')">Cancel</button>
      <button class="btn btn-amber" id="savePayment">Record</button>
    </div>
  </div>
</div>

<!-- MODAL: Fee Structure -->
<div class="modal-bg" id="feeModal">
  <div class="modal">
    <h3>Add Fee Structure</h3>
    <div class="fg"><label>Grade *</label><select id="f-grade"></select></div>
    <div class="fg-row">
      <div class="fg"><label>Term *</label>
        <select id="f-term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
      </div>
      <div class="fg"><label>Year *</label><input type="number" id="f-year" min="2020"></div>
    </div>
    <div class="fg"><label>Amount (KES) *</label><input type="number" id="f-amount" min="0" placeholder="12000"></div>
    <div class="fg"><label>Description</label><input id="f-desc" placeholder="Optional description"></div>
    <div id="feeAlert"></div>
    <div class="ma">
      <button class="btn btn-ghost" onclick="closeModal('feeModal')">Cancel</button>
      <button class="btn btn-amber" id="saveFee">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage, logout, finance, students, schools, auth } from "../js/api.js";
const me = guardPage(["FINANCE","SCHOOL_ADMIN"]);
// Instant display from session — no API wait
document.getElementById("uname").textContent = me.name + " · " + me.role;
document.getElementById("schoolName").textContent = me.school_name || "My School";
document.title = (me.school_name || "School") + " – Finance";
document.getElementById("logoutBtn").addEventListener("click", async(e) => {
  const b = e.currentTarget; b.disabled=true; b.classList.add("btn-loading");
  await logout();
});

const GRADES = [{id:1,l:"PP1"},{id:2,l:"PP2"},{id:3,l:"Grade 1"},{id:4,l:"Grade 2"},{id:5,l:"Grade 3"},
  {id:6,l:"Grade 4"},{id:7,l:"Grade 5"},{id:8,l:"Grade 6"},{id:9,l:"Grade 7"},{id:10,l:"Grade 8"},
  {id:11,l:"Grade 9"},{id:12,l:"Grade 10"},{id:13,l:"Grade 11"},{id:14,l:"Grade 12"}];

let allStudents = [];

document.querySelectorAll(".nav-item").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("panel-"+el.dataset.p).classList.add("active");
    document.getElementById("pageTitle").textContent = el.textContent.trim();
    if (el.dataset.p==="payments") loadPayments();
    if (el.dataset.p==="fees") loadFees();
  });
});

async function init() {
  // School name already set from session at page load
  // Students for dropdown
  const stuRes = await students.list({ school_id: me.school_id });
  allStudents = stuRes?.data||[];
  const pSel = document.getElementById("p-student");
  pSel.innerHTML = `<option value="">Select student…</option>` +
    allStudents.map(s=>`<option value="${s.id}">${s.full_name} (${s.admission_no})</option>`).join("");
  // Grades for fee form
  document.getElementById("f-grade").innerHTML =
    GRADES.map(g=>`<option value="${g.id}">${g.l}</option>`).join("");
  document.getElementById("p-year").value = new Date().getFullYear();
  document.getElementById("f-year").value = new Date().getFullYear();
  // Load summary
  loadSummary();
  loadRecentPayments();
}

async function loadSummary() {
  const res = await finance.summary({ year: new Date().getFullYear() });
  if (!res?.success) return;
  document.getElementById("sv-total").textContent = "KES " + Number(res.data.total_revenue).toLocaleString();
  res.data.by_term.forEach(t => {
    const el = document.getElementById(`sv-t${t.term}`);
    if (el) el.textContent = "KES " + Number(t.total).toLocaleString();
  });
}

async function loadRecentPayments() {
  const res = await finance.payments({});
  renderPaymentsTable("recentPayments", (res?.data||[]).slice(0,10));
}

async function loadPayments() {
  const term = document.getElementById("filterTerm").value;
  const year = document.getElementById("filterYear").value;
  const params = {};
  if (term) params.term = term;
  if (year) params.year = year;
  const res = await finance.payments(params);
  renderPaymentsTable("paymentsList", res?.data||[]);
}

function renderPaymentsTable(elId, data) {
  const el = document.getElementById(elId);
  if (!data.length) { el.innerHTML="<div class='empty'>No payments.</div>"; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Student</th><th>Adm No</th><th>Amount</th><th>Method</th><th>Term</th><th>Year</th><th>Reference</th><th>Date</th></tr></thead>
    <tbody>${data.map(p=>`<tr>
      <td><strong>${p.student_name||"–"}</strong></td>
      <td>${p.admission_no||"–"}</td>
      <td>KES ${Number(p.amount).toLocaleString()}</td>
      <td><span class="badge b-blue">${p.method}</span></td>
      <td>Term ${p.term}</td>
      <td>${p.year}</td>
      <td>${p.reference||"–"}</td>
      <td>${new Date(p.created_at).toLocaleDateString()}</td>
    </tr>`).join("")}</tbody></table>`;
}

async function loadFees() {
  const res = await finance.feeStructures({});
  const data = res?.data||[];
  const el = document.getElementById("feesList");
  if (!data.length) { el.innerHTML="<div class='empty'>No fee structures.</div>"; return; }
  el.innerHTML = `<table>
    <thead><tr><th>Grade</th><th>Term</th><th>Year</th><th>Amount (KES)</th><th>Description</th></tr></thead>
    <tbody>${data.map(f=>`<tr>
      <td>${f.grade_level||"–"}</td>
      <td>Term ${f.term}</td>
      <td>${f.year}</td>
      <td>KES ${Number(f.amount).toLocaleString()}</td>
      <td>${f.description||"–"}</td>
    </tr>`).join("")}</tbody></table>`;
}

// Payment modal
["ov-recordPayment","recordPaymentBtn"].forEach(id => {
  document.getElementById(id)?.addEventListener("click", () => {
    ["p-amount","p-ref","p-notes"].forEach(i=>document.getElementById(i).value="");
    document.getElementById("p-student").value="";
    document.getElementById("p-method").value="";
    document.getElementById("p-term").value="";
    document.getElementById("payAlert").innerHTML="";
    document.getElementById("payModal").classList.add("open");
  });
});
document.getElementById("applyFilter")?.addEventListener("click", loadPayments);

document.getElementById("savePayment").addEventListener("click", async () => {
  const body = {
    student_id: document.getElementById("p-student").value,
    amount:     parseFloat(document.getElementById("p-amount").value),
    method:     document.getElementById("p-method").value,
    term:       parseInt(document.getElementById("p-term").value),
    year:       parseInt(document.getElementById("p-year").value),
    reference:  document.getElementById("p-ref").value.trim(),
    notes:      document.getElementById("p-notes").value.trim(),
  };
  if (!body.student_id||!body.amount||!body.method||!body.term||!body.year) {
    setAlert("payAlert","Fill all required fields."); return;
  }
  const res = await finance.recordPayment(body);
  if (!res?.success) { setAlert("payAlert",res?.message||"Failed."); return; }
  setAlert("payAlert","Payment recorded!","as");
  setTimeout(() => { closeModal("payModal"); loadSummary(); loadRecentPayments(); }, 700);
});

// Fee modal
document.getElementById("addFeeBtn")?.addEventListener("click", () => {
  document.getElementById("f-amount").value="";
  document.getElementById("f-desc").value="";
  document.getElementById("feeAlert").innerHTML="";
  document.getElementById("feeModal").classList.add("open");
});
document.getElementById("saveFee").addEventListener("click", async () => {
  const body = {
    grade_id:    parseInt(document.getElementById("f-grade").value),
    term:        parseInt(document.getElementById("f-term").value),
    year:        parseInt(document.getElementById("f-year").value),
    amount:      parseFloat(document.getElementById("f-amount").value),
    description: document.getElementById("f-desc").value.trim(),
  };
  if (!body.grade_id||!body.amount) { setAlert("feeAlert","Grade and amount required."); return; }
  const res = await finance.createFeeStruct(body);
  if (!res?.success) { setAlert("feeAlert",res?.message||"Failed."); return; }
  setAlert("feeAlert","Fee structure saved!","as");
  setTimeout(() => { closeModal("feeModal"); loadFees(); }, 700);
});

window.closeModal = id => document.getElementById(id).classList.remove("open");
function setAlert(el, msg, cls="ae") { document.getElementById(el).innerHTML=`<div class="alert ${cls}">${msg}</div>`; }

init();
</script>
</body>
</html>
