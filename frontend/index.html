<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBC School ERP</title>
<script src="/js/config.js"></script>
</head>
<body>
<script type="module">
import { getUser, getToken, clearSession } from "/js/api.js";
const u = getUser();
const t = getToken();
if (u && t) {
  try {
    const p = JSON.parse(atob(t.split(".")[1]));
    if (!p.exp || p.exp * 1000 > Date.now()) {
      const dest = { SUPER_ADMIN:"/super-admin.html", PRINCIPAL:"/school-admin.html",
        DEPUTY_PRINCIPAL:"/school-admin.html", HOD:"/school-admin.html",
        TEACHER:"/teacher.html", BURSAR:"/bursar.html" };
      window.location.replace(dest[u.role] || "/login.html");
    } else { clearSession(); window.location.replace("/login.html"); }
  } catch { clearSession(); window.location.replace("/login.html"); }
} else {
  window.location.replace("/login.html");
}
</script>
</body>
</html>
