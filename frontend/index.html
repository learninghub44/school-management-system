<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBC School ERP</title>
<script src="/js/config.js"></script>
<script>
// Redirect to login or dashboard
const user = JSON.parse(sessionStorage.getItem("cbc_user") || "null");
if (user) {
  const dest = {
    SUPER_ADMIN:      "/super-admin.html",
    PRINCIPAL:        "/school-admin.html",
    DEPUTY_PRINCIPAL: "/school-admin.html",
    HOD:              "/school-admin.html",
    TEACHER:          "/teacher.html",
    BURSAR:           "/bursar.html",
  };
  window.location.replace(dest[user.role] || "/login.html");
} else {
  window.location.replace("/login.html");
}
</script>
</head>
<body></body>
</html>
