<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBC School ERP — Welcome</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#4338ca 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:460px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:center}
.logo-icon{width:64px;height:64px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px}
h1{font-size:26px;font-weight:800;color:#0f172a;letter-spacing:-0.5px}
.sub{font-size:14px;color:#64748b;margin-top:6px;margin-bottom:36px;font-weight:500}
.divider{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.fg{margin-bottom:16px;text-align:left}
.fg label{display:block;font-size:11.5px;font-weight:700;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fg input{width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;color:#0f172a;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;text-transform:uppercase;letter-spacing:.05em}
.fg input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.fg input::placeholder{color:#cbd5e1;text-transform:none;letter-spacing:normal}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn-secondary{background:#f1f5f9;color:#475569;margin-top:10px}
.btn-secondary:hover{background:#e2e8f0}
.alert{padding:12px 16px;border-radius:10px;font-size:13.5px;margin-bottom:16px;font-weight:500;display:none;text-align:left}
.alert.show{display:block}
.alert-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.footer{margin-top:28px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
<div class="card">
  <div class="logo-icon">🏫</div>
  <h1>CBC School ERP</h1>
  <p class="sub">Kenya Competency Based Curriculum Management System</p>

  <div class="divider">Enter your school code to continue</div>

  <div class="alert alert-err" id="errMsg"></div>

  <div class="fg">
    <label>School Code</label>
    <input id="schoolCode" type="text" placeholder="e.g. KPRI001" maxlength="20" autofocus>
  </div>

  <button class="btn btn-primary" id="continueBtn">Continue to School Portal →</button>
  <button class="btn btn-secondary" id="adminBtn">Super Admin Login</button>

  <div class="footer">CBC School ERP v5.0 · Powered by ZETU Business Solutions</div>
</div>

<script>
// This is the root domain landing page — no auth imports needed
// Just redirects to the correct subdomain

const ROOT    = "cbc-school-erp.pages.dev";
const errEl   = document.getElementById("errMsg");
const input   = document.getElementById("schoolCode");

function showErr(msg) {
  errEl.textContent = msg;
  errEl.className = "alert alert-err show";
}

document.getElementById("continueBtn").addEventListener("click", () => {
  const code = input.value.trim().toUpperCase();
  if (!code) return showErr("Please enter your school code.");
  if (!/^[A-Z0-9]{3,20}$/.test(code)) return showErr("Invalid school code format.");
  errEl.className = "alert alert-err";

  // Redirect to school subdomain
  window.location.href = `https://${code.toLowerCase()}.${ROOT}/login.html`;
});

document.getElementById("adminBtn").addEventListener("click", () => {
  window.location.href = `https://admin.${ROOT}/login.html`;
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("continueBtn").click();
});
</script>
</body>
</html>
