<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bursar Portal — CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="mainStyle"></style>
</head>
<body>
<div id="app"></div>

<!-- RECORD PAYMENT MODAL -->
<div class="modal-bg" id="modal-payment">
<div class="modal">
  <div class="modal-hdr"><h3>Record Payment</h3><button class="modal-close" data-close="modal-payment">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class</label><select id="py-class"><option value="">All Classes</option></select></div>
    <div class="fg"><label>Student *</label><select id="py-student"><option value="">Select Student</option></select></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Receipt No *</label><input id="py-receipt" maxlength="50" placeholder="e.g. RCP-2025-0001"></div>
    <div class="fg"><label>Amount (KES) *</label><input id="py-amount" type="number" min="1" step="0.01"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Method *</label>
      <select id="py-method">
        <option value="Cash">Cash</option><option value="M-Pesa">M-Pesa</option>
        <option value="Bank Transfer">Bank Transfer</option><option value="Cheque">Cheque</option><option value="Card">Card</option>
      </select>
    </div>
    <div class="fg"><label>Date *</label><input id="py-date" type="date"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Term *</label>
      <select id="py-term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
    <div class="fg"><label>Academic Year *</label><input id="py-year" maxlength="4"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Fee Item</label><select id="py-fee"><option value="">General Payment</option></select></div>
    <div class="fg"><label>Balance (KES)</label><input id="py-balance" type="number" value="0" min="0"></div>
  </div>
  <div class="fg"><label>M-Pesa / Ref No</label><input id="py-ref" maxlength="100"></div>
  <div class="fg"><label>Notes</label><textarea id="py-notes" maxlength="300"></textarea></div>
  <div id="py-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-payment">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitPayment">Record Payment</button>
  </div>
</div></div>

<!-- ADD FEE STRUCTURE MODAL -->
<div class="modal-bg" id="modal-fee">
<div class="modal">
  <div class="modal-hdr"><h3>Add Fee Structure</h3><button class="modal-close" data-close="modal-fee">×</button></div>
  <div class="fg"><label>Fee Name *</label><input id="fee-name" maxlength="100" placeholder="e.g. Tuition Fee, Activity Fee"></div>
  <div class="fg-row">
    <div class="fg"><label>Amount (KES) *</label><input id="fee-amount" type="number" min="1" step="0.01"></div>
    <div class="fg"><label>Term *</label>
      <select id="fee-term"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Class (optional)</label><select id="fee-class"><option value="">All Classes</option></select></div>
    <div class="fg"><label>Academic Year *</label><input id="fee-year" maxlength="4"></div>
  </div>
  <div id="fee-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-fee">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitFee">Add Fee</button>
  </div>
</div></div>

<script type="module">
import { guardPage, esc, apiFetch, finance, classes, students } from "/js/api.js";
import { SHARED_CSS, buildSidebar, setupNav, openModal, closeModal, resetModal, showAlert, setLoading } from "/js/layout.js";
document.getElementById("mainStyle").textContent = SHARED_CSS;

let me = guardPage(["BURSAR"]);
if (!me) throw new Error();
const vRes = await apiFetch("/auth/verify");
if (!vRes?.success) { clearSession(); location.href="/login.html"; throw new Error(); }
me = vRes.user;

let allClasses=[], allStudents=[], allFeeStructures=[];

const NAV = [
  { panel:"dashboard",  icon:"📊", label:"Dashboard" },
  { panel:"payments",   icon:"💳", label:"Payments" },
  { panel:"fees",       icon:"📋", label:"Fee Structures" },
  { panel:"balances",   icon:"⚖️",  label:"Student Balances" },
];

document.getElementById("app").innerHTML = `
${buildSidebar(NAV,"dashboard")}
<div class="main">
  <header class="topbar">
    <h3 id="pageTitle">Dashboard</h3>
    <div class="topbar-right">${esc(me.school_name)} · ${esc(me.role)}</div>
  </header>
  <div class="content">
    <div class="panel active" id="panel-dashboard">
      <div class="stat-grid" id="statsGrid"></div>
      <div class="card"><div class="card-hdr"><h4>Recent Payments</h4></div><div class="card-body"><div class="table-wrap" id="recentPayTbl"></div></div></div>
    </div>
    <div class="panel" id="panel-payments">
      <div class="card">
        <div class="card-hdr"><h4>All Payments</h4><button class="btn btn-primary" id="btnAddPayment">+ Record Payment</button></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterPayTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
            <input type="date" id="filterPayFrom" placeholder="From">
            <input type="date" id="filterPayTo" placeholder="To">
          </div>
          <div class="table-wrap" id="payTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-fees">
      <div class="card">
        <div class="card-hdr"><h4>Fee Structures</h4><button class="btn btn-primary" id="btnAddFee">+ Add Fee</button></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterFeeClass"><option value="">All Classes</option></select>
            <select id="filterFeeTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
          </div>
          <div class="table-wrap" id="feeTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>
    <div class="panel" id="panel-balances">
      <div class="card">
        <div class="card-hdr"><h4>Student Fee Balances</h4></div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterBalClass"><option value="">All Classes</option></select>
          </div>
          <div class="table-wrap" id="balTbl"><div class="empty">Select a class to view balances</div></div>
        </div>
      </div>
    </div>
  </div>
</div>`;

setupNav({ dashboard:loadDashboard, payments:loadPayments, fees:loadFees, balances:()=>{} });
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeModal(b.dataset.close)));
document.querySelectorAll(".modal-bg").forEach(bg=>bg.addEventListener("click",e=>{if(e.target===bg)closeModal(bg.id);}));

// Load shared data
const [clRes, studRes, fsRes] = await Promise.all([
  classes.list({ academic_year:me.academic_year }),
  students.list({ is_active:true }),
  finance.feeStructures({ academic_year:me.academic_year }),
]);
allClasses = clRes?.data||[];
allStudents = studRes?.data||[];
allFeeStructures = fsRes?.data||[];

// Populate dropdowns
["py-class","filterFeeClass","filterBalClass","fee-class"].forEach(id=>{
  const el=document.getElementById(id); if(!el) return;
  const isFilter=id.startsWith("filter");
  el.innerHTML=(isFilter?'<option value="">All Classes</option>':'<option value="">All Classes</option>')+
    allClasses.map(c=>`<option value="${esc(String(c.id))}">${esc(c.grade)}${c.stream?" "+esc(c.stream):""}</option>`).join("");
});
document.getElementById("py-year").value = me.academic_year;
document.getElementById("fee-year").value = me.academic_year;
document.getElementById("py-term").value = String(me.current_term);
document.getElementById("fee-term").value = String(me.current_term);
document.getElementById("py-date").value = new Date().toISOString().split("T")[0];

// Populate fee structure dropdown in payment modal
function refreshFeeDropdown() {
  const el=document.getElementById("py-fee");
  el.innerHTML='<option value="">General Payment</option>'+
    allFeeStructures.map(f=>`<option value="${esc(String(f.id))}">${esc(f.fee_name)} – KES ${Number(f.amount).toLocaleString("en-KE")}</option>`).join("");
}
refreshFeeDropdown();

// When class changes in payment modal, filter students
document.getElementById("py-class").addEventListener("change",()=>{
  const cid=document.getElementById("py-class").value;
  const filtered=cid?allStudents.filter(s=>String(s.class_id)===cid):allStudents;
  document.getElementById("py-student").innerHTML='<option value="">Select Student</option>'+
    filtered.map(s=>`<option value="${esc(String(s.id))}">${esc(s.last_name)}, ${esc(s.first_name)} (${esc(s.admission_number)})</option>`).join("");
});

async function loadDashboard() {
  const year=me.academic_year;
  const [sumRes,recentRes]=await Promise.all([
    finance.summary({academic_year:year}),
    finance.payments({academic_year:year}),
  ]);
  const s=sumRes?.data||{};
  document.getElementById("statsGrid").innerHTML=`
    <div class="stat-card"><div class="val">KES ${Number(s.total_collected||0).toLocaleString("en-KE",{minimumFractionDigits:0})}</div><div class="lbl">Total Collected (${esc(year)})</div></div>
    <div class="stat-card"><div class="val">KES ${Number(s.total_balance||0).toLocaleString("en-KE",{minimumFractionDigits:0})}</div><div class="lbl">Outstanding Balances</div></div>
    <div class="stat-card"><div class="val">${esc(String(s.payment_count||0))}</div><div class="lbl">Payment Records</div></div>
    <div class="stat-card"><div class="val">${esc(String(s.students_paid||0))}</div><div class="lbl">Students Paid</div></div>`;
  const recents=(recentRes?.data||[]).slice(0,10);
  document.getElementById("recentPayTbl").innerHTML=recents.length?`<table><thead><tr><th>Receipt</th><th>Student</th><th>Amount</th><th>Method</th><th>Date</th></tr></thead><tbody>
    ${recents.map(p=>`<tr><td><code style="font-size:12px">${esc(p.receipt_number)}</code></td><td>${esc(p.student_name)}<br><span style="font-size:11px;color:#94a3b8">${esc(p.admission_number)}</span></td><td><strong>KES ${Number(p.amount_paid).toLocaleString("en-KE")}</strong></td><td>${esc(p.payment_method)}</td><td>${p.payment_date?new Date(p.payment_date).toLocaleDateString("en-KE"):"–"}</td></tr>`).join("")}
  </tbody></table>`:'<div class="empty">No payments recorded yet</div>';
}

async function loadPayments() {
  document.getElementById("payTbl").innerHTML='<div class="empty">Loading…</div>';
  const r=await finance.payments({
    term:document.getElementById("filterPayTerm").value||undefined,
    date_from:document.getElementById("filterPayFrom").value||undefined,
    date_to:document.getElementById("filterPayTo").value||undefined,
    academic_year:me.academic_year,
  });
  const data=r?.data||[];
  if(!data.length){document.getElementById("payTbl").innerHTML='<div class="empty">No payments found</div>';return;}
  document.getElementById("payTbl").innerHTML=`<table><thead><tr><th>Receipt</th><th>Student</th><th>Class</th><th>Fee Item</th><th>Amount</th><th>Method</th><th>Ref</th><th>Date</th><th>Balance</th></tr></thead><tbody>
    ${data.map(p=>`<tr>
      <td><code style="font-size:12px">${esc(p.receipt_number)}</code></td>
      <td><strong>${esc(p.student_name)}</strong><br><span style="font-size:11px;color:#94a3b8">${esc(p.admission_number)}</span></td>
      <td>${esc(p.class_label||"–")}</td>
      <td>${esc(p.fee_name||"General")}</td>
      <td><strong>KES ${Number(p.amount_paid).toLocaleString("en-KE")}</strong></td>
      <td><span class="badge ${p.payment_method==="M-Pesa"?"bg":p.payment_method==="Cash"?"by":"bb"}">${esc(p.payment_method)}</span></td>
      <td style="font-size:12px">${esc(p.reference||"–")}</td>
      <td>${p.payment_date?new Date(p.payment_date).toLocaleDateString("en-KE"):"–"}</td>
      <td style="color:${Number(p.balance)>0?"#b91c1c":"#15803d"}"><strong>KES ${Number(p.balance||0).toLocaleString("en-KE")}</strong></td>
    </tr>`).join("")}
  </tbody></table>`;
}
document.getElementById("filterPayTerm").addEventListener("change",loadPayments);
document.getElementById("filterPayFrom").addEventListener("change",loadPayments);
document.getElementById("filterPayTo").addEventListener("change",loadPayments);

async function loadFees() {
  document.getElementById("feeTbl").innerHTML='<div class="empty">Loading…</div>';
  const r=await finance.feeStructures({
    class_id:document.getElementById("filterFeeClass").value||undefined,
    term:document.getElementById("filterFeeTerm").value||undefined,
    academic_year:me.academic_year,
  });
  allFeeStructures=r?.data||[];
  refreshFeeDropdown();
  if(!allFeeStructures.length){document.getElementById("feeTbl").innerHTML='<div class="empty">No fee structures defined</div>';return;}
  const total=allFeeStructures.reduce((s,f)=>s+Number(f.amount),0);
  document.getElementById("feeTbl").innerHTML=`<table><thead><tr><th>Fee Name</th><th>Class</th><th>Amount</th><th>Term</th><th>Year</th><th>Actions</th></tr></thead><tbody>
    ${allFeeStructures.map(f=>`<tr>
      <td><strong>${esc(f.fee_name)}</strong></td>
      <td>${f.class_label?`<span class="badge bb">${esc(f.class_label)}</span>`:"All Classes"}</td>
      <td><strong>KES ${Number(f.amount).toLocaleString("en-KE")}</strong></td>
      <td>Term ${esc(String(f.term))}</td>
      <td>${esc(f.academic_year)}</td>
      <td><button class="btn btn-sm btn-danger" data-act="del-fee" data-id="${esc(String(f.id))}">Delete</button></td>
    </tr>`).join("")}
    <tr style="background:#f8fafc;font-weight:700"><td colspan="2">TOTAL</td><td>KES ${total.toLocaleString("en-KE")}</td><td colspan="3"></td></tr>
  </tbody></table>`;
  document.querySelectorAll("[data-act='del-fee']").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Delete this fee structure?")) return;
    await finance.deleteFee(b.dataset.id); loadFees();
  }));
}
document.getElementById("filterFeeClass").addEventListener("change",loadFees);
document.getElementById("filterFeeTerm").addEventListener("change",loadFees);

document.getElementById("filterBalClass").addEventListener("change",async()=>{
  const cid=document.getElementById("filterBalClass").value;
  if(!cid){document.getElementById("balTbl").innerHTML='<div class="empty">Select a class to view balances</div>';return;}
  document.getElementById("balTbl").innerHTML='<div class="empty">Loading…</div>';
  const studs=allStudents.filter(s=>String(s.class_id)===cid);
  if(!studs.length){document.getElementById("balTbl").innerHTML='<div class="empty">No students in this class</div>';return;}
  const balances=await Promise.all(studs.map(s=>finance.studentBalance(s.id,{academic_year:me.academic_year})));
  document.getElementById("balTbl").innerHTML=`<table><thead><tr><th>Student</th><th>Adm No</th><th>Total Billed</th><th>Total Paid</th><th>Outstanding</th></tr></thead><tbody>
    ${studs.map((s,i)=>{const b=balances[i]?.data||{};const outstanding=Number(b.total_billed||0)-Number(b.total_paid||0);return`<tr>
      <td><strong>${esc(s.last_name)}, ${esc(s.first_name)}</strong></td>
      <td><code style="font-size:12px">${esc(s.admission_number)}</code></td>
      <td>KES ${Number(b.total_billed||0).toLocaleString("en-KE")}</td>
      <td>KES ${Number(b.total_paid||0).toLocaleString("en-KE")}</td>
      <td style="color:${outstanding>0?"#b91c1c":"#15803d"};font-weight:700">KES ${outstanding.toLocaleString("en-KE")}</td>
    </tr>`;}).join("")}
  </tbody></table>`;
});

// Open modals
document.getElementById("btnAddPayment").addEventListener("click",()=>{
  // Reset student dropdown
  document.getElementById("py-student").innerHTML='<option value="">Select Student</option>'+
    allStudents.map(s=>`<option value="${esc(String(s.id))}">${esc(s.last_name)}, ${esc(s.first_name)} (${esc(s.admission_number)})</option>`).join("");
  openModal("modal-payment");
});
document.getElementById("btnAddFee").addEventListener("click",()=>openModal("modal-fee"));

// Submit payment
document.getElementById("btnSubmitPayment").addEventListener("click",async()=>{
  const sid=document.getElementById("py-student").value;
  const receipt=document.getElementById("py-receipt").value.trim();
  const amount=document.getElementById("py-amount").value;
  const method=document.getElementById("py-method").value;
  const date=document.getElementById("py-date").value;
  const term=document.getElementById("py-term").value;
  const year=document.getElementById("py-year").value.trim();
  const alertEl=document.getElementById("py-alert");
  if(!sid||!receipt||!amount||!method||!date||!term||!year) return showAlert(alertEl,"All required fields must be filled.");
  setLoading("btnSubmitPayment",true);
  const r=await finance.recordPayment({
    student_id:sid, receipt_number:receipt, amount_paid:parseFloat(amount),
    payment_method:method, payment_date:date, term:parseInt(term), academic_year:year,
    fee_structure_id:document.getElementById("py-fee").value||null,
    balance:parseFloat(document.getElementById("py-balance").value)||0,
    reference:document.getElementById("py-ref").value.trim()||null,
    notes:document.getElementById("py-notes").value.trim()||null,
  });
  setLoading("btnSubmitPayment",false);
  if(r?.success){showAlert(alertEl,"✓ Payment recorded.","ok");setTimeout(()=>{closeModal("modal-payment");resetModal("modal-payment");loadPayments();loadDashboard();},1200);}
  else showAlert(alertEl,r?.message||"Error recording payment.");
});

// Submit fee structure
document.getElementById("btnSubmitFee").addEventListener("click",async()=>{
  const name=document.getElementById("fee-name").value.trim();
  const amount=document.getElementById("fee-amount").value;
  const term=document.getElementById("fee-term").value;
  const year=document.getElementById("fee-year").value.trim();
  const alertEl=document.getElementById("fee-alert");
  if(!name||!amount||!term||!year) return showAlert(alertEl,"Fee name, amount, term and year required.");
  setLoading("btnSubmitFee",true);
  const r=await finance.createFee({
    fee_name:name, amount:parseFloat(amount), term:parseInt(term), academic_year:year,
    class_id:document.getElementById("fee-class").value||null,
  });
  setLoading("btnSubmitFee",false);
  if(r?.success){showAlert(alertEl,"✓ Fee structure added.","ok");setTimeout(()=>{closeModal("modal-fee");resetModal("modal-fee");loadFees();},1200);}
  else showAlert(alertEl,r?.message||"Error.");
});

loadDashboard();
</script>
</body>
</html>
