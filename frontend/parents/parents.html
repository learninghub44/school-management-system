<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent CBC Reports</title>
    <link rel="stylesheet" href="../css/style.css">
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>Parent Portal</h2>

        <a href="../dashboard.html">Dashboard</a>
        <a href="parents.html" class="active">My Child Reports</a>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <h3>My Child CBC Reports</h3>

            <span id="parentEmail"></span>

        </header>

        <section class="content">

            <!-- CHILD SELECT -->
            <div class="card">

                <h2>Select Child</h2>

                <select id="childSelect"></select>

                <button onclick="loadReports()">View Reports</button>

            </div>

            <!-- REPORT TABLE -->
            <div class="table-container">

                <h2>CBC Performance Report</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Learning Area</th>
                            <th>Strand</th>
                            <th>Score</th>
                            <th>Comment</th>
                            <th>Teacher</th>
                        </tr>
                    </thead>

                    <tbody id="reportTable"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script type="module" src="../js/parentReports.js"></script>

</body>
</html>
