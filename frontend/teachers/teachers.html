<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC Teachers Module</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>CBC Portal</h2>

        <a href="../dashboard.html">Dashboard</a>
        <a href="../students/students.html">Students</a>
        <a href="teachers.html" class="active">Teachers</a>
        <a href="../assessments/assessments.html">Assessments</a>
        <a href="../parents/parents.html">Parents</a>

        <a id="financeMenu" href="../finance/finance.html">Finance</a>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <h3>Teachers Management (CBC System)</h3>

            <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>

        </header>

        <!-- CONTENT -->
        <section class="content">

            <!-- ADD TEACHER CARD -->
            <div class="card">

                <h2>Add Teacher</h2>

                <input id="tName" type="text" placeholder="Teacher Name">
                <input id="tEmail" type="email" placeholder="Email">
                <input id="tPhone" type="text" placeholder="Phone Number">

                <select id="tRole">
                    <option value="TEACHER">TEACHER</option>
                    <option value="HEAD_OF_DEPARTMENT">HEAD OF DEPARTMENT</option>
                    <option value="PRINCIPAL">PRINCIPAL</option>
                    <option value="ADMIN">ADMIN</option>
                </select>

                <button onclick="addTeacher()">Save Teacher</button>

            </div>

            <!-- TEACHERS TABLE -->
            <div class="table-container">

                <h2>Teachers List</h2>

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                        </tr>
                    </thead>

                    <tbody id="teacherTable">
                        <!-- Supabase data loads here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- IMPORTANT: MODULE SCRIPT -->
<script type="module" src="../js/teachers.js"></script>

</body>
</html>
