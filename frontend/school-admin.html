<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Admin — CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="mainStyle"></style>
</head>
<body>
<div id="app"></div>

<!-- ═══════ MODALS ═══════ -->

<!-- ADD STUDENT -->
<div class="modal-bg" id="modal-student">
<div class="modal">
  <div class="modal-hdr"><h3>Add New Student</h3><button class="modal-close" data-close="modal-student">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>First Name *</label><input id="s-fname" maxlength="80"></div>
    <div class="fg"><label>Last Name *</label><input id="s-lname" maxlength="80"></div>
  </div>
  <div class="fg"><label>Middle Name</label><input id="s-mname" maxlength="80"></div>
  <div class="fg-row">
    <div class="fg"><label>Admission No *</label><input id="s-adm" maxlength="30"></div>
    <div class="fg"><label>UPI No</label><input id="s-upi" maxlength="30"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Gender *</label>
      <select id="s-gender"><option value="">Select</option><option>Male</option><option>Female</option></select></div>
    <div class="fg"><label>Date of Birth</label><input id="s-dob" type="date"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="s-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Admission Date</label><input id="s-admdate" type="date"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Parent/Guardian Name</label><input id="s-parent" maxlength="150"></div>
    <div class="fg"><label>Parent Phone</label><input id="s-pphone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg"><label>Address</label><textarea id="s-addr" maxlength="300"></textarea></div>
  <div id="s-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-student">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitStudent">Add Student</button>
  </div>
</div></div>

<!-- ADD TEACHER -->
<div class="modal-bg" id="modal-teacher">
<div class="modal">
  <div class="modal-hdr"><h3>Add Teacher</h3><button class="modal-close" data-close="modal-teacher">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>First Name *</label><input id="t-fname" maxlength="80"></div>
    <div class="fg"><label>Last Name *</label><input id="t-lname" maxlength="80"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>TSC Number</label><input id="t-tsc" maxlength="30"></div>
    <div class="fg"><label>Phone *</label><input id="t-phone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Email</label><input id="t-email" type="email" maxlength="150"></div>
    <div class="fg"><label>Department</label><select id="t-dept"><option value="">Select</option></select></div>
  </div>
  <div class="fg"><label>Designation</label><input id="t-desig" maxlength="100" placeholder="e.g. Senior Teacher"></div>
  <div id="t-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-teacher">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitTeacher">Add Teacher</button>
  </div>
</div></div>

<!-- ADD STAFF USER -->
<div class="modal-bg" id="modal-staff">
<div class="modal">
  <div class="modal-hdr"><h3>Add Staff Account</h3><button class="modal-close" data-close="modal-staff">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Full Name *</label><input id="st-name" maxlength="150"></div>
    <div class="fg"><label>Phone</label><input id="st-phone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg"><label>Username *</label><input id="st-username" maxlength="50" placeholder="e.g. jdoe2024"></div>
  <div class="fg"><label>Email *</label><input id="st-email" type="email" maxlength="150"></div>
  <div class="fg"><label>Role *</label>
    <select id="st-role">
      <option value="">Select Role</option>
      <option value="PRINCIPAL">Principal</option>
      <option value="DEPUTY_PRINCIPAL">Deputy Principal</option>
      <option value="HOD">HOD</option>
      <option value="TEACHER">Teacher</option>
      <option value="BURSAR">Bursar</option>
    </select>
  </div>
  <div class="fg"><label>Temporary Password *</label><input id="st-pass" type="password" minlength="8" maxlength="72" placeholder="Min 8 chars, uppercase, lowercase, number"></div>
  <div id="st-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-staff">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitStaff">Create Account</button>
  </div>
</div></div>

<!-- ADD CLASS -->
<div class="modal-bg" id="modal-class">
<div class="modal">
  <div class="modal-hdr"><h3>Add Class</h3><button class="modal-close" data-close="modal-class">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Grade *</label>
      <select id="cl-grade">
        <option value="">Select Grade</option>
        <option>PP1</option><option>PP2</option>
        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
        <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
        <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
      </select>
    </div>
    <div class="fg"><label>Stream</label><input id="cl-stream" maxlength="20" placeholder="East, A, Blue…"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Academic Year *</label><input id="cl-year" maxlength="4" placeholder="2025"></div>
    <div class="fg"><label>Capacity</label><input id="cl-cap" type="number" min="1" max="100" value="40"></div>
  </div>
  <div class="fg"><label>Class Teacher</label><select id="cl-teacher"><option value="">None</option></select></div>
  <div id="cl-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-class">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitClass">Add Class</button>
  </div>
</div></div>

<!-- ASSIGN TEACHER -->
<div class="modal-bg" id="modal-assign">
<div class="modal">
  <div class="modal-hdr"><h3>Assign Teacher to Subject</h3><button class="modal-close" data-close="modal-assign">×</button></div>
  <div class="fg"><label>Teacher *</label><select id="as-teacher"><option value="">Select Teacher</option></select></div>
  <div class="fg"><label>Class *</label><select id="as-class"><option value="">Select Class</option></select></div>
  <div class="fg"><label>Learning Area / Subject *</label><select id="as-subject"><option value="">Select Subject</option></select></div>
  <div class="fg"><label>Role *</label>
    <select id="as-role">
      <option value="">Select</option>
      <option value="Class Teacher">Class Teacher</option>
      <option value="Subject Teacher">Subject Teacher</option>
      <option value="HOD">HOD</option>
    </select>
  </div>
  <div class="fg"><label>Academic Year *</label><input id="as-year" maxlength="4" placeholder="2025"></div>
  <div id="as-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-assign">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAssign">Create Assignment</button>
  </div>
</div></div>

<!-- BULK ATTENDANCE -->
<div class="modal-bg" id="modal-att">
<div class="modal" style="max-width:640px">
  <div class="modal-hdr"><h3>Record Attendance</h3><button class="modal-close" data-close="modal-att">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="att-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Date *</label><input id="att-date" type="date"></div>
  </div>
  <button class="btn btn-ghost" id="btnLoadAttStudents" style="width:100%;margin-bottom:14px">Load Students</button>
  <div id="att-students" style="max-height:300px;overflow-y:auto;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px"></div>
  <div id="att-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-att">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAtt">Save Attendance</button>
  </div>
</div></div>

<!-- ADD ASSESSMENT -->
<div class="modal-bg" id="modal-assess">
<div class="modal">
  <div class="modal-hdr"><h3>Record Assessment</h3><button class="modal-close" data-close="modal-assess">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="asc-class" id="asc-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Student *</label><select id="asc-student"><option value="">Select Student</option></select></div>
  </div>
  <div class="fg"><label>Learning Area *</label><select id="asc-subject"><option value="">Select Subject</option></select></div>
  <div class="fg-row">
    <div class="fg"><label>Achievement Level *</label>
      <select id="asc-level">
        <option value="">Select</option>
        <option value="EE">EE – Exceeds Expectation</option>
        <option value="ME">ME – Meets Expectation</option>
        <option value="AE">AE – Approaches Expectation</option>
        <option value="BE">BE – Below Expectation</option>
      </select>
    </div>
    <div class="fg"><label>Score (0–100)</label><input id="asc-score" type="number" min="0" max="100"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Assessment Type *</label>
      <select id="asc-type">
        <option value="Formative">Formative</option>
        <option value="Summative">Summative</option>
        <option value="Project">Project</option>
        <option value="Observation">Observation</option>
      </select>
    </div>
    <div class="fg"><label>Term *</label>
      <select id="asc-term"><option value="">Select</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Strand</label><input id="asc-strand" maxlength="150"></div>
    <div class="fg"><label>Sub-Strand</label><input id="asc-substrand" maxlength="150"></div>
  </div>
  <div class="fg"><label>Academic Year *</label><input id="asc-year" maxlength="4"></div>
  <div class="fg"><label>Teacher Comment</label><textarea id="asc-comment" maxlength="600"></textarea></div>
  <div id="asc-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-assess">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAssess">Save Assessment</button>
  </div>
</div></div>

<script type="module">
import { guardPage, esc, logout, apiFetch,
  users, teachers, classes, students, departments,
  assignments, attendance, assessments, reports, schools
} from "/js/api.js";
import { SHARED_CSS, buildSidebar, setupNav, openModal, closeModal, resetModal, showAlert, setLoading } from "/js/layout.js";

document.getElementById("mainStyle").textContent = SHARED_CSS;

const ALLOWED = ["PRINCIPAL","DEPUTY_PRINCIPAL","HOD"];
let me = guardPage(ALLOWED);
if (!me) throw new Error("Unauthorized");

// Verify server-side
const vRes = await apiFetch("/auth/verify");
if (!vRes?.success) { clearSession(); location.href="/login.html"; throw new Error(); }
me = vRes.user;

// ── State ──────────────────────────────────────────────────────────
let allClasses=[], allTeachers=[], allStudents=[], allDepts=[], allLearningAreas=[];

// ── Build layout ───────────────────────────────────────────────────
const NAV = [
  { panel:"overview",    icon:"📊", label:"Dashboard" },
  { panel:"students",    icon:"👥", label:"Students" },
  { panel:"teachers",    icon:"👨‍🏫", label:"Teachers" },
  { panel:"classes",     icon:"🏛️", label:"Classes" },
  { panel:"assignments", icon:"📌", label:"Assignments" },
  { panel:"attendance",  icon:"📋", label:"Attendance" },
  { panel:"assessments", icon:"📚", label:"Assessments" },
  { panel:"reports",     icon:"📄", label:"Report Cards" },
  { panel:"staff",       icon:"🔑", label:"Staff Users" },
];

document.getElementById("app").innerHTML = `
${buildSidebar(NAV, "overview")}
<div class="main">
  <header class="topbar">
    <h3 id="pageTitle">Dashboard</h3>
    <div class="topbar-right">${esc(me.school_name)} · ${esc(me.email)} · ${esc(me.role)}</div>
  </header>
  <div class="content">

    <div class="panel active" id="panel-overview">
      <div class="stat-grid" id="statsGrid"></div>
      <div class="card"><div class="card-hdr"><h4>Attendance — Last 7 Days</h4></div><div class="card-body" id="attSummary"></div></div>
      <div class="card"><div class="card-hdr"><h4>CBC Achievement Distribution</h4></div><div class="card-body" id="cbcChart"></div></div>
    </div>

    <div class="panel" id="panel-students">
      <div class="card">
        <div class="card-hdr"><h4>Students</h4>
          ${me.role !== "HOD" ? '<button class="btn btn-primary" id="btnAddStudent">+ Add Student</button>' : ""}
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <input type="text" id="filterStudent" placeholder="Search name or adm no…" style="flex:1;min-width:180px">
            <select id="filterStudentClass"><option value="">All Classes</option></select>
            <select id="filterStudentStatus"><option value="">Active & Inactive</option><option value="true">Active Only</option><option value="false">Inactive Only</option></select>
          </div>
          <div class="table-wrap" id="studentsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-teachers">
      <div class="card">
        <div class="card-hdr"><h4>Teachers</h4>
          ${me.role !== "HOD" ? '<button class="btn btn-primary" id="btnAddTeacher">+ Add Teacher</button>' : ""}
        </div>
        <div class="card-body">
          <div class="table-wrap" id="teachersTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-classes">
      <div class="card">
        <div class="card-hdr"><h4>Classes</h4>
          ${me.role !== "HOD" ? '<button class="btn btn-primary" id="btnAddClass">+ Add Class</button>' : ""}
        </div>
        <div class="card-body">
          <div class="table-wrap" id="classesTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-assignments">
      <div class="card">
        <div class="card-hdr"><h4>Teacher Assignments</h4>
          ${me.role !== "HOD" ? '<button class="btn btn-primary" id="btnAddAssign">+ Assign Teacher</button>' : ""}
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAssignTeacher"><option value="">All Teachers</option></select>
            <select id="filterAssignClass"><option value="">All Classes</option></select>
          </div>
          <div class="table-wrap" id="assignmentsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-attendance">
      <div class="card">
        <div class="card-hdr"><h4>Attendance Records</h4>
          <button class="btn btn-primary" id="btnAddAtt">+ Record Attendance</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <input type="date" id="filterAttDate">
            <select id="filterAttClass"><option value="">All Classes</option></select>
            <select id="filterAttStatus"><option value="">All Statuses</option><option value="Present">Present</option><option value="Absent">Absent</option><option value="Late">Late</option></select>
          </div>
          <div class="table-wrap" id="attendanceTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-assessments">
      <div class="card">
        <div class="card-hdr"><h4>CBC Assessments</h4>
          <button class="btn btn-primary" id="btnAddAssess">+ Record Assessment</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAssessClass"><option value="">All Classes</option></select>
            <select id="filterAssessTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
          </div>
          <div class="table-wrap" id="assessmentsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-reports">
      <div class="card">
        <div class="card-hdr"><h4>Report Cards</h4>
          <button class="btn btn-primary" id="btnGenReport">+ Generate Report Card</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterRptClass"><option value="">All Classes</option></select>
            <select id="filterRptTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
          </div>
          <div class="table-wrap" id="reportsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <div class="panel" id="panel-staff">
      <div class="card">
        <div class="card-hdr"><h4>Staff Accounts</h4>
          <button class="btn btn-primary" id="btnAddStaff">+ Add Staff</button>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="staffTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

  </div>
</div>`;

setupNav({
  overview: loadDashboard, students: loadStudents, teachers: loadTeachers,
  classes: loadClasses, assignments: loadAssignments, attendance: loadAttendance,
  assessments: loadAssessments, reports: loadReports, staff: loadStaff
});

// Close modals
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal(b.dataset.close)));
document.querySelectorAll(".modal-bg").forEach(bg => bg.addEventListener("click", e => { if(e.target===bg) closeModal(bg.id); }));

// ── Load shared data ───────────────────────────────────────────────
await Promise.all([fetchClasses(), fetchTeachers(), fetchDepts(), fetchLearningAreas()]);
loadDashboard();

async function fetchClasses() {
  const r = await classes.list({ academic_year: me.academic_year });
  allClasses = r?.data || [];
  ["filterStudentClass","filterAttClass","filterAssignClass","filterAssessClass","filterRptClass",
   "s-class","att-class","as-class","asc-class","cl-teacher"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (id === "cl-teacher") return; // teacher dropdown not class
    const isFilter = id.startsWith("filter");
    el.innerHTML = (isFilter ? '<option value="">All Classes</option>' : '<option value="">Select Class</option>') +
      allClasses.map(c => `<option value="${esc(String(c.id))}">${esc(c.grade)}${c.stream?" "+esc(c.stream):""}</option>`).join("");
  });
}

async function fetchTeachers() {
  const r = await teachers.list({ is_active: true });
  allTeachers = r?.data || [];
  ["as-teacher","filterAssignTeacher","cl-teacher","t-dept"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (id === "t-dept" || id === "filterAssignTeacher") return;
    el.innerHTML = '<option value="">Select Teacher</option>' +
      allTeachers.map(t => `<option value="${esc(String(t.id))}">${esc(t.first_name)} ${esc(t.last_name)}</option>`).join("");
  });
  const fa = document.getElementById("filterAssignTeacher");
  if (fa) fa.innerHTML = '<option value="">All Teachers</option>' +
    allTeachers.map(t => `<option value="${esc(String(t.id))}">${esc(t.first_name)} ${esc(t.last_name)}</option>`).join("");
}

async function fetchDepts() {
  const r = await departments.list({});
  allDepts = r?.data || [];
  const el = document.getElementById("t-dept");
  if (el) el.innerHTML = '<option value="">No Department</option>' +
    allDepts.map(d => `<option value="${esc(String(d.id))}">${esc(d.name)}</option>`).join("");
}

async function fetchLearningAreas() {
  const r = await schools.learningAreas({});
  allLearningAreas = r?.data || [];
  const el = document.getElementById("as-subject");
  if (el) el.innerHTML = '<option value="">Select Subject</option>' +
    allLearningAreas.map(la => `<option value="${esc(String(la.id))}">${esc(la.name)} (${esc(la.stage)})</option>`).join("");
}

// ── Dashboard ──────────────────────────────────────────────────────
async function loadDashboard() {
  const r = await reports.dashboard({ academic_year: me.academic_year });
  const d = r?.data;
  if (!d) return;
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="val">${esc(String(d.students.total))}</div><div class="lbl">Total Students</div><div class="sub">♂ ${esc(String(d.students.male||0))} · ♀ ${esc(String(d.students.female||0))}</div></div>
    <div class="stat-card"><div class="val">${esc(String(d.teachers.total))}</div><div class="lbl">Active Teachers</div></div>
    <div class="stat-card"><div class="val">${esc(String(d.classes.total))}</div><div class="lbl">Classes (${esc(me.academic_year)})</div></div>
    <div class="stat-card"><div class="val">KES ${Number(d.finance.collected||0).toLocaleString("en-KE",{minimumFractionDigits:0})}</div><div class="lbl">Fees Collected</div><div class="sub">Balance: KES ${Number(d.finance.balance||0).toLocaleString("en-KE",{minimumFractionDigits:0})}</div></div>`;
  const aw = d.attendance_week;
  const rate = aw.total>0 ? ((aw.present/aw.total)*100).toFixed(1) : "0.0";
  document.getElementById("attSummary").innerHTML = `
    <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:14px">
      <span>✅ Present: <strong>${esc(String(aw.present||0))}</strong></span>
      <span>❌ Absent: <strong>${esc(String(aw.absent||0))}</strong></span>
      <span>📈 Rate: <strong>${esc(rate)}%</strong></span>
    </div>`;
  const levels = { EE:0, ME:0, AE:0, BE:0 };
  (d.assessments_by_level||[]).forEach(l => levels[l.achievement_level] = parseInt(l.count));
  const total = Object.values(levels).reduce((a,b)=>a+b,0) || 1;
  document.getElementById("cbcChart").innerHTML = `
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      ${Object.entries(levels).map(([k,v])=>`
        <div style="flex:1;min-width:100px;text-align:center">
          <div class="level-${esc(k)}" style="display:block;padding:10px;font-size:22px;font-weight:800;border-radius:10px;margin-bottom:6px">${esc(String(v))}</div>
          <div style="font-size:12px;color:#64748b;font-weight:700">${esc(k)}</div>
          <div style="font-size:11px;color:#94a3b8">${(v/total*100).toFixed(1)}%</div>
        </div>`).join("")}
    </div>`;
}

// ── Students ───────────────────────────────────────────────────────
async function loadStudents() {
  document.getElementById("studentsTbl").innerHTML = '<div class="empty">Loading…</div>';
  const r = await students.list({ is_active: document.getElementById("filterStudentStatus").value || undefined, class_id: document.getElementById("filterStudentClass").value || undefined });
  allStudents = r?.data || [];
  renderStudents(allStudents);
}

function renderStudents(data) {
  const tbl = document.getElementById("studentsTbl");
  if (!data.length) { tbl.innerHTML = '<div class="empty">No students found</div>'; return; }
  tbl.innerHTML = `<table><thead><tr><th>Adm No</th><th>Name</th><th>Gender</th><th>Class</th><th>Parent Phone</th><th>Status</th>${me.role!=="HOD"?"<th>Actions</th>":""}</tr></thead><tbody>
    ${data.map(s=>`<tr>
      <td><code style="font-size:12px">${esc(s.admission_number)}</code></td>
      <td><strong>${esc(s.last_name)}, ${esc(s.first_name)}${s.middle_name?" "+esc(s.middle_name):""}</strong>${s.upi_number?`<br><span style="font-size:11px;color:#94a3b8">UPI: ${esc(s.upi_number)}</span>`:""}</td>
      <td>${esc(s.gender||"–")}</td>
      <td>${s.class_label?`<span class="badge bb">${esc(s.class_label)}</span>`:"–"}</td>
      <td>${esc(s.parent_phone||"–")}</td>
      <td><span class="badge ${s.is_active?"bg":"br"}">${s.is_active?"Active":"Inactive"}</span></td>
      ${me.role!=="HOD"?`<td><div class="action-btns">
        <button class="btn btn-sm btn-warn" data-act="toggle-student" data-id="${esc(String(s.id))}" data-active="${s.is_active}">${s.is_active?"Deactivate":"Activate"}</button>
      </div></td>`:""}
    </tr>`).join("")}
  </tbody></table>`;
  tbl.querySelectorAll("[data-act='toggle-student']").forEach(b=>b.addEventListener("click",async()=>{
    await students.update(b.dataset.id,{is_active:b.dataset.active!=="true"}); loadStudents();
  }));
}

document.getElementById("filterStudent").addEventListener("input", ()=>{
  const q = document.getElementById("filterStudent").value.toLowerCase();
  renderStudents(allStudents.filter(s=>(s.first_name+" "+s.last_name+" "+s.admission_number).toLowerCase().includes(q)));
});
document.getElementById("filterStudentClass").addEventListener("change", loadStudents);
document.getElementById("filterStudentStatus").addEventListener("change", loadStudents);

      <td>${esc(t.phone||"–")}</td>

// ── Classes ────────────────────────────────────────────────────────
async function loadClasses() {
  document.getElementById("classesTbl").innerHTML = '<div class="empty">Loading…</div>';
  await fetchClasses();
  if (!allClasses.length) { document.getElementById("classesTbl").innerHTML = '<div class="empty">No classes found</div>'; return; }
  document.getElementById("classesTbl").innerHTML = `<table><thead><tr><th>Grade</th><th>Stream</th><th>Stage</th><th>Class Teacher</th><th>Year</th><th>Students</th><th>Capacity</th>${me.role!=="HOD"?"<th>Actions</th>":""}</tr></thead><tbody>
    ${allClasses.map(c=>`<tr>
      <td><strong>${esc(c.grade)}</strong></td>
      <td>${esc(c.stream||"–")}</td>
      <td><span class="badge bgray">${esc(c.stage)}</span></td>
      <td>${esc(c.class_teacher_name||"Unassigned")}</td>
      <td>${esc(c.academic_year)}</td>
      <td>${esc(String(c.student_count||0))}</td>
      <td>${esc(String(c.capacity||40))}</td>
      ${me.role!=="HOD"?`<td><button class="btn btn-sm btn-danger" data-act="del-class" data-id="${esc(String(c.id))}">Delete</button></td>`:""}
    </tr>`).join("")}
  </tbody></table>`;
  document.querySelectorAll("[data-act='del-class']").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Delete this class? Cannot delete if it has active students.")) return;
    const r = await classes.delete(b.dataset.id);
    if(r?.success) loadClasses(); else alert(r?.message||"Error deleting class.");
  }));
}

async function loadStaff() {
  document.getElementById("staffTbl").innerHTML = '<div class="empty">Loading…</div>';
  const r = await users.list({});
  const data = (r?.data||[]).filter(u=>u.id!==me.id);
  if (!data.length) { document.getElementById("staffTbl").innerHTML = '<div class="empty">No staff found</div>'; return; }
  const rmap = {PRINCIPAL:"bb",DEPUTY_PRINCIPAL:"bpurple",HOD:"bteal",TEACHER:"bg",BURSAR:"by"};
  document.getElementById("staffTbl").innerHTML = `<table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${data.map(u=>`<tr>
      <td><strong>${esc(u.name)}</strong><br><span style="font-size:12px;color:#64748b">${esc(u.email)}</span></td>
      <td><code style="font-size:12px">${esc(u.username)}</code></td>
      <td><span class="badge ${rmap[u.role]||"bgray"}">${esc(u.role)}</span></td>
      <td style="font-size:12px">${u.last_login?new Date(u.last_login).toLocaleDateString("en-KE"):"Never"}</td>
      <td><span class="badge ${u.is_active?"bg":"br"}">${u.is_active?"Active":"Inactive"}</span></td>
      <td><div class="action-btns">
        <button class="btn btn-sm btn-warn" data-act="toggle-user" data-id="${esc(String(u.id))}" data-active="${u.is_active}">${u.is_active?"Deactivate":"Activate"}</button>
        <button class="btn btn-sm btn-ghost" data-act="reset-pw" data-id="${esc(String(u.id))}" data-name="${esc(u.name)}">Reset PW</button>
      </div></td>
    </tr>`).join("")}
  </tbody></table>`;
  document.querySelectorAll("[data-act='toggle-user']").forEach(b=>b.addEventListener("click",async()=>{
    await users.update(b.dataset.id,{is_active:b.dataset.active!=="true"}); loadStaff();
  }));
  document.querySelectorAll("[data-act='reset-pw']").forEach(b=>b.addEventListener("click",async()=>{
    const pw = prompt(`New password for ${b.dataset.name} (min 8 chars, uppercase+lowercase+number):`);
    if (!pw||pw.length<8) return;
    const r = await users.resetPassword(b.dataset.id,pw);
    alert(r?.message||(r?.success?"Done":"Error"));
  }));
}

// Load students when class selected in assessment modal
document.getElementById("asc-class")?.addEventListener("change", async ()=>{
  const cid = document.getElementById("asc-class").value;
  const el = document.getElementById("asc-student");
  if (!cid) { el.innerHTML='<option value="">Select Student</option>'; return; }
  const r = await classes.students(cid);
  el.innerHTML = '<option value="">Select Student</option>' +
    (r?.data||[]).map(s=>`<option value="${esc(String(s.id))}">${esc(s.last_name)}, ${esc(s.first_name)}</option>`).join("");
  // filter learning areas by stage
  const cls = allClasses.find(c=>String(c.id)===cid);
  if (cls) {
    const filtered = allLearningAreas.filter(la=>la.stage===cls.stage);
    const sl = document.getElementById("asc-subject");
    sl.innerHTML = '<option value="">Select Subject</option>' +
      filtered.map(la=>`<option value="${esc(String(la.id))}">${esc(la.name)}</option>`).join("");
  }
});

document.getElementById("btnSubmitStudent").addEventListener("click", async ()=>{
  const fname=document.getElementById("s-fname").value.trim();
  const lname=document.getElementById("s-lname").value.trim();
  const adm=document.getElementById("s-adm").value.trim();
  const gender=document.getElementById("s-gender").value;

  const r=await students.create({
    first_name:fname, middle_name:document.getElementById("s-mname").value.trim()||null,

    parent_phone:document.getElementById("s-pphone").value.trim()||null,
    address:document.getElementById("s-addr").value.trim()||null,
  });
  setLoading("btnSubmitStudent",false);
  if(r?.success){showAlert(alertEl,"✓ Student added.","ok");setTimeout(()=>{closeModal("modal-student");resetModal("modal-student");loadStudents();},1200);}

  });
  setLoading("btnSubmitAssess",false);
  if(r?.success){showAlert(alertEl,"✓ Assessment saved.","ok");setTimeout(()=>{closeModal("modal-assess");resetModal("modal-assess");loadAssessments();},1200);}
  else showAlert(alertEl,r?.message||"Error.");
});

// ADD STAFF USER
document.getElementById("btnSubmitStaff").addEventListener("click", async ()=>{
  const name=document.getElementById("st-name").value.trim();
  const username=document.getElementById("st-username").value.trim();
  const email=document.getElementById("st-email").value.trim();
  const role=document.getElementById("st-role").value;
  const pass=document.getElementById("st-pass").value;
  const alertEl=document.getElementById("st-alert");
  if(!name||!username||!email||!role||!pass) return showAlert(alertEl,"All fields required.");
  if(pass.length<8) return showAlert(alertEl,"Password must be at least 8 characters.");
  setLoading("btnSubmitStaff",true);
  const r=await users.create({name,username,email,role,password:pass,phone:document.getElementById("st-phone").value.trim()||null});
  setLoading("btnSubmitStaff",false);
  if(r?.success){showAlert(alertEl,"✓ Staff account created. Must change password on first login.","ok");setTimeout(()=>{closeModal("modal-staff");resetModal("modal-staff");loadStaff();},1400);}
  else showAlert(alertEl,r?.message||"Error.");
});
</script>
