<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Admin — CBC ERP</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<!-- ADD STUDENT -->
<div class="modal-bg" id="modal-student">
<div class="modal">
  <div class="modal-hdr"><h3>Add New Student</h3><button class="modal-close" data-close="modal-student">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>First Name *</label><input id="s-fname" maxlength="80"></div>
    <div class="fg"><label>Last Name *</label><input id="s-lname" maxlength="80"></div>
  </div>
  <div class="fg"><label>Middle Name</label><input id="s-mname" maxlength="80"></div>
  <div class="fg-row">
    <div class="fg"><label>Admission No *</label><input id="s-adm" maxlength="30"></div>
    <div class="fg"><label>UPI No</label><input id="s-upi" maxlength="30"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Gender *</label>
      <select id="s-gender"><option value="">Select</option><option>Male</option><option>Female</option></select>
    </div>
    <div class="fg"><label>Date of Birth</label><input id="s-dob" type="date"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="s-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Admission Date</label><input id="s-admdate" type="date"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Parent/Guardian Name</label><input id="s-parent" maxlength="150"></div>
    <div class="fg"><label>Parent Phone</label><input id="s-pphone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg"><label>Address</label><textarea id="s-addr" maxlength="300"></textarea></div>
  <div id="s-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-student">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitStudent">Add Student</button>
  </div>
</div></div>

<!-- ADD TEACHER -->
<div class="modal-bg" id="modal-teacher">
<div class="modal">
  <div class="modal-hdr"><h3>Add Teacher</h3><button class="modal-close" data-close="modal-teacher">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>First Name *</label><input id="t-fname" maxlength="80"></div>
    <div class="fg"><label>Last Name *</label><input id="t-lname" maxlength="80"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>TSC Number</label><input id="t-tsc" maxlength="30"></div>
    <div class="fg"><label>Phone *</label><input id="t-phone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Email</label><input id="t-email" type="email" maxlength="150"></div>
    <div class="fg"><label>Department</label><select id="t-dept"><option value="">Select</option></select></div>
  </div>
  <div class="fg"><label>Designation</label><input id="t-desig" maxlength="100" placeholder="e.g. Senior Teacher"></div>
  <div id="t-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-teacher">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitTeacher">Add Teacher</button>
  </div>
</div></div>

<!-- ADD STAFF ACCOUNT -->
<div class="modal-bg" id="modal-staff">
<div class="modal">
  <div class="modal-hdr"><h3>Add Staff Account</h3><button class="modal-close" data-close="modal-staff">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Full Name *</label><input id="st-name" maxlength="150"></div>
    <div class="fg"><label>Phone</label><input id="st-phone" type="tel" maxlength="20"></div>
  </div>
  <div class="fg"><label>Username *</label><input id="st-username" maxlength="50" placeholder="e.g. jdoe2024"></div>
  <div class="fg"><label>Email *</label><input id="st-email" type="email" maxlength="150"></div>
  <div class="fg"><label>Role *</label>
    <select id="st-role">
      <option value="">Select Role</option>
      <option value="PRINCIPAL">Principal</option><option value="DEPUTY_PRINCIPAL">Deputy Principal</option>
      <option value="HOD">HOD</option><option value="TEACHER">Teacher</option><option value="BURSAR">Bursar</option>
    </select>
  </div>
  <div class="fg"><label>Temporary Password *</label><input id="st-pass" type="password" minlength="8" maxlength="72" placeholder="Min 8 chars, uppercase, lowercase, number"></div>
  <div id="st-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-staff">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitStaff">Create Account</button>
  </div>
</div></div>

<!-- ADD CLASS -->
<div class="modal-bg" id="modal-class">
<div class="modal">
  <div class="modal-hdr"><h3>Add Class</h3><button class="modal-close" data-close="modal-class">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Grade *</label>
      <select id="cl-grade">
        <option value="">Select Grade</option>
        <option>PP1</option><option>PP2</option>
        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
        <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
        <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
      </select>
    </div>
    <div class="fg"><label>Stream</label><input id="cl-stream" maxlength="20" placeholder="East, A, Blue…"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Academic Year *</label><input id="cl-year" maxlength="4" placeholder="2025"></div>
    <div class="fg"><label>Capacity</label><input id="cl-cap" type="number" min="1" max="100" value="40"></div>
  </div>
  <div class="fg"><label>Class Teacher</label><select id="cl-teacher"><option value="">None</option></select></div>
  <div id="cl-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-class">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitClass">Add Class</button>
  </div>
</div></div>

<!-- ASSIGN TEACHER -->
<div class="modal-bg" id="modal-assign">
<div class="modal">
  <div class="modal-hdr"><h3>Assign Teacher to Subject</h3><button class="modal-close" data-close="modal-assign">×</button></div>
  <div class="fg"><label>Teacher *</label><select id="as-teacher"><option value="">Select Teacher</option></select></div>
  <div class="fg"><label>Class *</label><select id="as-class"><option value="">Select Class</option></select></div>
  <div class="fg"><label>Learning Area / Subject *</label><select id="as-subject"><option value="">Select Subject</option></select></div>
  <div class="fg"><label>Role *</label>
    <select id="as-role">
      <option value="">Select</option>
      <option value="Class Teacher">Class Teacher</option>
      <option value="Subject Teacher">Subject Teacher</option>
      <option value="HOD">HOD</option>
    </select>
  </div>
  <div class="fg"><label>Academic Year *</label><input id="as-year" maxlength="4" placeholder="2025"></div>
  <div id="as-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-assign">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAssign">Create Assignment</button>
  </div>
</div></div>

<!-- BULK ATTENDANCE -->
<div class="modal-bg" id="modal-att">
<div class="modal" style="max-width:640px">
  <div class="modal-hdr"><h3>Record Attendance</h3><button class="modal-close" data-close="modal-att">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="att-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Date *</label><input id="att-date" type="date"></div>
  </div>
  <button class="btn btn-ghost" id="btnLoadAttStudents" style="width:100%;margin-bottom:14px">Load Students</button>
  <div id="att-students" style="max-height:300px;overflow-y:auto;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px"></div>
  <div id="att-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-att">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAtt">Save Attendance</button>
  </div>
</div></div>

<!-- ADD ASSESSMENT -->
<div class="modal-bg" id="modal-assess">
<div class="modal">
  <div class="modal-hdr"><h3>Record Assessment</h3><button class="modal-close" data-close="modal-assess">×</button></div>
  <div class="fg-row">
    <div class="fg"><label>Class *</label><select id="asc-class"><option value="">Select Class</option></select></div>
    <div class="fg"><label>Student *</label><select id="asc-student"><option value="">Select Student</option></select></div>
  </div>
  <div class="fg"><label>Learning Area *</label><select id="asc-subject"><option value="">Select Subject</option></select></div>
  <div class="fg-row">
    <div class="fg"><label>Achievement Level *</label>
      <select id="asc-level">
        <option value="">Select</option>
        <option value="EE">EE – Exceeds Expectation</option><option value="ME">ME – Meets Expectation</option>
        <option value="AE">AE – Approaches Expectation</option><option value="BE">BE – Below Expectation</option>
      </select>
    </div>
    <div class="fg"><label>Score (0–100)</label><input id="asc-score" type="number" min="0" max="100"></div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Assessment Type *</label>
      <select id="asc-type">
        <option value="Formative">Formative</option><option value="Summative">Summative</option>
        <option value="Project">Project</option><option value="Observation">Observation</option>
      </select>
    </div>
    <div class="fg"><label>Term *</label>
      <select id="asc-term"><option value="">Select</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
    </div>
  </div>
  <div class="fg-row">
    <div class="fg"><label>Strand</label><input id="asc-strand" maxlength="150"></div>
    <div class="fg"><label>Sub-Strand</label><input id="asc-substrand" maxlength="150"></div>
  </div>
  <div class="fg"><label>Academic Year *</label><input id="asc-year" maxlength="4"></div>
  <div class="fg"><label>Teacher Comment</label><textarea id="asc-comment" maxlength="600"></textarea></div>
  <div id="asc-alert"></div>
  <div class="modal-actions">
    <button class="btn btn-ghost" data-close="modal-assess">Cancel</button>
    <button class="btn btn-primary" id="btnSubmitAssess">Save Assessment</button>
  </div>
</div></div>

<script type="module">
// ── Imports — clearSession NOW INCLUDED ───────────────────────────
import {
  guardPage, esc, logout, apiFetch, clearSession,
  users, teachers, classes, students, departments,
  assignments, attendance, assessments, reports, schools, verifySession
} from "/js/api.js";
import {, buildSidebar, setupNav,
  openModal, closeModal, resetModal,
  showAlert, setLoading, injectStyles
} from "/js/layout.js";

injectStyles();

const ALLOWED = ["PRINCIPAL", "DEPUTY_PRINCIPAL", "HOD"];
let me = guardPage(ALLOWED);
if (!me) throw new Error("Unauthorized");

// FIX: consistent pattern — catches auth failure AND tenant mismatch,
// but survives network errors (Render cold start)
const vRes = await verifySession();
if (!vRes.ok && vRes.reason !== "network") {
  clearSession();
  window.location.replace("/login.html");
  throw new Error("Redirecting");
}
if (vRes.ok) me = vRes.user;

// ── Nav items ─────────────────────────────────────────────────────
const NAV = [
  { panel: "overview",    icon: "📊", label: "Dashboard"    },
  { panel: "students",    icon: "🎒", label: "Students"     },
  { panel: "teachers",    icon: "👨‍🏫", label: "Teachers"    },
  { panel: "classes",     icon: "🏫", label: "Classes"      },
  { panel: "assignments", icon: "📋", label: "Assignments"  },
  { panel: "attendance",  icon: "✅", label: "Attendance"   },
  { panel: "assessments", icon: "📝", label: "Assessments"  },
  { panel: "staff",       icon: "👤", label: "Staff Accounts"},
];

// ── Render shell ──────────────────────────────────────────────────
document.getElementById("app").innerHTML =
  buildSidebar(NAV, "overview") + `
<div class="main">
  <header class="topbar">
    <h3 id="pageTitle">Dashboard</h3>
    <div class="topbar-right">${esc(me.school_name || "")} · ${esc(me.role || "")}</div>
  </header>
  <div class="content">

    <!-- OVERVIEW -->
    <div class="panel active" id="panel-overview">
      <div class="stat-grid" id="statsGrid"><div class="empty">Loading…</div></div>
    </div>

    <!-- STUDENTS -->
    <div class="panel" id="panel-students">
      <div class="card">
        <div class="card-hdr">
          <h4>Students</h4>
          <button class="btn btn-primary" id="btnAddStudent">+ Add Student</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterStudentClass"><option value="">All Classes</option></select>
            <input type="text" id="filterStudentQ" placeholder="Search name or admission no…" style="flex:1">
          </div>
          <div class="table-wrap" id="studentsTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- TEACHERS -->
    <div class="panel" id="panel-teachers">
      <div class="card">
        <div class="card-hdr">
          <h4>Teachers</h4>
          <button class="btn btn-primary" id="btnAddTeacher">+ Add Teacher</button>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="teachersTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- CLASSES -->
    <div class="panel" id="panel-classes">
      <div class="card">
        <div class="card-hdr">
          <h4>Classes</h4>
          <button class="btn btn-primary" id="btnAddClass">+ Add Class</button>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="classesTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- ASSIGNMENTS -->
    <div class="panel" id="panel-assignments">
      <div class="card">
        <div class="card-hdr">
          <h4>Teacher Assignments</h4>
          <button class="btn btn-primary" id="btnAddAssign">+ Assign Teacher</button>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="assignTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- ATTENDANCE -->
    <div class="panel" id="panel-attendance">
      <div class="card">
        <div class="card-hdr">
          <h4>Attendance</h4>
          <button class="btn btn-primary" id="btnRecordAtt">+ Record Attendance</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAttClass"><option value="">All Classes</option></select>
            <input id="filterAttDate" type="date">
          </div>
          <div class="table-wrap" id="attTbl"><div class="empty">Select a class and date above, then load.</div></div>
        </div>
      </div>
    </div>

    <!-- ASSESSMENTS -->
    <div class="panel" id="panel-assessments">
      <div class="card">
        <div class="card-hdr">
          <h4>Assessments</h4>
          <button class="btn btn-primary" id="btnAddAssess">+ Record Assessment</button>
        </div>
        <div class="card-body">
          <div class="filter-bar">
            <select id="filterAssessClass"><option value="">All Classes</option></select>
            <select id="filterAssessTerm"><option value="">All Terms</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select>
          </div>
          <div class="table-wrap" id="assessTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- STAFF ACCOUNTS -->
    <div class="panel" id="panel-staff">
      <div class="card">
        <div class="card-hdr">
          <h4>Staff Accounts</h4>
          <button class="btn btn-primary" id="btnAddStaff">+ Add Account</button>
        </div>
        <div class="card-body">
          <div class="table-wrap" id="staffTbl"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

  </div>
</div>`;

// ── State ─────────────────────────────────────────────────────────
let allClasses  = [];
let allTeachers = [];

// ── Nav & logout ──────────────────────────────────────────────────
const loaders = {
  overview:    loadOverview,
  students:    loadStudents,
  teachers:    loadTeachers,
  classes:     loadClasses,
  assignments: loadAssignments,
  attendance:  () => {},       // triggered by filter
  assessments: loadAssessments,
  staff:       loadStaff,
};
setupNav(loaders);

// ── Modal close wiring ────────────────────────────────────────────
document.querySelectorAll("[data-close]").forEach(b =>
  b.addEventListener("click", () => closeModal(b.dataset.close)));
document.querySelectorAll(".modal-bg").forEach(bg =>
  bg.addEventListener("click", e => { if (e.target === bg) closeModal(bg.id); }));

// ── Load initial data ─────────────────────────────────────────────
async function fetchClasses() {
  // api.js: classes.list(params) → GET /classes
  const r = await classes.list({ school_id: me.school_id });
  allClasses = r?.data || [];
  const opts = allClasses.map(c =>
    `<option value="${esc(String(c.id))}">${esc(c.name || c.grade_level)}</option>`).join("");
  ["s-class","cl-teacher","att-class","filterStudentClass","filterAttClass",
   "filterAssessClass","as-class","asc-class"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const prefix = id.startsWith("filter") ? '<option value="">All Classes</option>'
                 : id === "cl-teacher"     ? '<option value="">None</option>'
                 : '<option value="">Select Class</option>';
    el.innerHTML = prefix + opts;
  });
}

async function fetchTeachers() {
  // api.js: teachers.list(params) → GET /teachers
  const r = await teachers.list({ school_id: me.school_id });
  allTeachers = r?.data || [];
  const opts = allTeachers.map(t =>
    `<option value="${esc(String(t.id))}">${esc(t.name || (t.first_name + " " + t.last_name))}</option>`).join("");
  ["cl-teacher","as-teacher"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<option value="">None</option>` + opts;
  });
}

async function fetchDepts() {
  // api.js: departments.list(params) → GET /departments
  const r = await departments.list({ school_id: me.school_id });
  const el = document.getElementById("t-dept");
  if (!el) return;
  el.innerHTML = '<option value="">Select</option>' +
    (r?.data || []).map(d => `<option value="${esc(String(d.id))}">${esc(d.name)}</option>`).join("");
}

async function fetchLearningAreas() {
  // api.js: schools.learningAreas(params) → GET /schools/learning-areas
  const r  = await schools.learningAreas({ school_id: me.school_id });
  const el = document.getElementById("as-subject");
  const asc = document.getElementById("asc-subject");
  const opts = '<option value="">Select Subject</option>' +
    (r?.data || []).map(s => `<option value="${esc(s.id || s.name)}">${esc(s.name)}</option>`).join("");
  if (el)  el.innerHTML  = opts;
  if (asc) asc.innerHTML = opts;
}

await Promise.all([fetchClasses(), fetchTeachers(), fetchDepts(), fetchLearningAreas()]);

// ── Overview ──────────────────────────────────────────────────────
async function loadOverview() {
  // api.js: reports.dashboard(params) → GET /reports/dashboard
  const r = await reports.dashboard({ school_id: me.school_id });
  const d = r?.data || {};
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="val">${d.student_count  ?? 0}</div><div class="lbl">Students</div></div>
    <div class="stat-card"><div class="val">${d.teacher_count  ?? 0}</div><div class="lbl">Teachers</div></div>
    <div class="stat-card"><div class="val">${d.class_count    ?? 0}</div><div class="lbl">Classes</div></div>
    <div class="stat-card"><div class="val">${d.present_today  ?? "–"}</div><div class="lbl">Present Today</div><div class="sub">Attendance</div></div>`;
}

// ── Students ──────────────────────────────────────────────────────
async function loadStudents() {
  document.getElementById("studentsTbl").innerHTML = '<div class="empty">Loading…</div>';
  const classId = document.getElementById("filterStudentClass").value;
  const q       = document.getElementById("filterStudentQ").value.trim();
  // api.js: students.list(params) → GET /students
  const r    = await students.list({ school_id: me.school_id, class_id: classId || undefined, search: q || undefined });
  const data = r?.data || [];
  if (!data.length) { document.getElementById("studentsTbl").innerHTML = '<div class="empty">No students found</div>'; return; }
  document.getElementById("studentsTbl").innerHTML = `<table><thead><tr>
    <th>Name</th><th>Adm No</th><th>Class</th><th>Gender</th><th>Parent</th><th>Status</th><th>Actions</th>
  </tr></thead><tbody>
    ${data.map(s => `<tr>
      <td><strong>${esc(s.full_name || (s.first_name + " " + s.last_name))}</strong></td>
      <td>${esc(s.admission_no)}</td>
      <td>${esc(s.class_name || "–")}</td>
      <td>${esc(s.gender || "–")}</td>
      <td>${esc(s.parent_name || "–")}<br><span style="font-size:11px;color:#64748b">${esc(s.parent_phone || "")}</span></td>
      <td><span class="badge ${s.is_active !== false ? "bg" : "br"}">${s.is_active !== false ? "Active" : "Inactive"}</span></td>
      <td><button class="btn btn-sm btn-ghost" data-act="edit-student" data-id="${esc(String(s.id))}">Edit</button></td>
    </tr>`).join("")}
  </tbody></table>`;
}
document.getElementById("filterStudentClass")?.addEventListener("change", loadStudents);
document.getElementById("filterStudentQ")?.addEventListener("input",  loadStudents);

document.getElementById("btnAddStudent")?.addEventListener("click", () => { resetModal("modal-student"); openModal("modal-student"); });
document.getElementById("btnSubmitStudent")?.addEventListener("click", async () => {
  const fname   = document.getElementById("s-fname").value.trim();
  const lname   = document.getElementById("s-lname").value.trim();
  const adm     = document.getElementById("s-adm").value.trim();
  const gender  = document.getElementById("s-gender").value;
  const classId = document.getElementById("s-class").value;
  const alertEl = document.getElementById("s-alert");
  if (!fname || !lname || !adm || !gender || !classId)
    return showAlert(alertEl, "First name, last name, admission number, gender and class are required.");
  setLoading("btnSubmitStudent", true);
  // api.js: students.create(d) → POST /students
  const r = await students.create({
    first_name:    fname,
    last_name:     lname,
    middle_name:   document.getElementById("s-mname").value.trim()   || null,
    admission_no:  adm,
    upi_no:        document.getElementById("s-upi").value.trim()     || null,
    gender,
    dob:           document.getElementById("s-dob").value            || null,
    class_id:      classId,
    admission_date:document.getElementById("s-admdate").value        || null,
    parent_name:   document.getElementById("s-parent").value.trim()  || null,
    parent_phone:  document.getElementById("s-pphone").value.trim()  || null,
    address:       document.getElementById("s-addr").value.trim()    || null,
    school_id:     me.school_id,
  });
  setLoading("btnSubmitStudent", false);
  if (r?.success) {

          `<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">

});

// ── Staff accounts ────────────────────────────────────────────────
async function loadStaff() {
  document.getElementById("staffTbl").innerHTML = '<div class="empty">Loading…</div>';
  // api.js: users.list(params) → GET /users
  const r    = await users.list({ school_id: me.school_id });
  const data = r?.data || [];
  if (!data.length) { document.getElementById("staffTbl").innerHTML = '<div class="empty">No staff accounts found</div>'; return; }
  const roleBadge = { PRINCIPAL: "bb", DEPUTY_PRINCIPAL: "bpurple", HOD: "bteal", TEACHER: "bg", BURSAR: "by" };
  document.getElementById("staffTbl").innerHTML = `<table><thead><tr>
    <th>Name</th><th>Username</th><th>Role</th><th>Email</th><th>Status</th><th>Actions</th>
  </tr></thead><tbody>
    ${data.map(u => `<tr>
      <td><strong>${esc(u.name)}</strong></td>
      <td><code style="font-family:monospace;font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:4px">${esc(u.username)}</code></td>
      <td><span class="badge ${roleBadge[u.role] || "bgray"}">${esc(u.role)}</span></td>
      <td style="font-size:12px">${esc(u.email)}</td>
      <td><span class="badge ${u.is_active ? "bg" : "br"}">${u.is_active ? "Active" : "Inactive"}</span></td>
      <td><div class="action-btns">
        <button class="btn btn-sm ${u.is_active ? "btn-danger" : "btn-success"}"
          data-act="toggle-staff" data-id="${esc(String(u.id))}" data-active="${u.is_active}">
          ${u.is_active ? "Deactivate" : "Activate"}
        </button>
        <button class="btn btn-sm btn-ghost" data-act="reset-staff-pw" data-id="${esc(String(u.id))}" data-name="${esc(u.name)}">
          Reset PW
        </button>
      </div></td>
    </tr>`).join("")}
  </tbody></table>`;

  // api.js: users.update(id, { is_active }) → PUT /users/:id
  document.querySelectorAll("[data-act='toggle-staff']").forEach(b =>
    b.addEventListener("click", async () => {
      const nowActive = b.dataset.active === "true";
      const r = await users.update(b.dataset.id, { is_active: !nowActive });
      if (r?.success) loadStaff();
      else alert(r?.message || "Error updating account.");
    }));

  // api.js: users.resetPassword(id, pw) → POST /users/:id/reset-password
  document.querySelectorAll("[data-act='reset-staff-pw']").forEach(b =>
    b.addEventListener("click", async () => {
      const pw = prompt(`Reset password for ${b.dataset.name}\n\nNew password (min 8 chars):`);
      if (!pw) return;
      if (pw.length < 8) { alert("Password must be at least 8 characters."); return; }
      const r = await users.resetPassword(b.dataset.id, pw);
      alert(r?.success ? "Password reset successfully." : (r?.message || "Error resetting password."));
    }));
}

document.getElementById("btnAddStaff")?.addEventListener("click", () => { resetModal("modal-staff"); openModal("modal-staff"); });
document.getElementById("btnSubmitStaff")?.addEventListener("click", async () => {
  const name     = document.getElementById("st-name").value.trim();
  const username = document.getElementById("st-username").value.trim();
  const email    = document.getElementById("st-email").value.trim();
  const role     = document.getElementById("st-role").value;
  const pass     = document.getElementById("st-pass").value;
  const alertEl  = document.getElementById("st-alert");
  if (!name || !username || !email || !role || !pass)
    return showAlert(alertEl, "All required fields must be filled.");
  if (pass.length < 8)
    return showAlert(alertEl, "Password must be at least 8 characters.");
  setLoading("btnSubmitStaff", true);
  // api.js: users.create(d) → POST /users
  const r = await users.create({
    name, username, email, role, password: pass,
    phone:     document.getElementById("st-phone").value.trim() || null,
    school_id: me.school_id,
  });
  setLoading("btnSubmitStaff", false);
  if (r?.success) {
    showAlert(alertEl, "✓ Account created. User must change password on first login.", "ok");
    setTimeout(() => { closeModal("modal-staff"); loadStaff(); }, 1400);
  } else showAlert(alertEl, r?.message || "Failed to create account.");
});
