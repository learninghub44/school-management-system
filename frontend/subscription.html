<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscription - Kadem & Zetu School Management System</title>
<script src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:28px}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}
h1{font-size:28px;line-height:1.2}
.muted{color:#94a3b8;font-size:14px;margin-top:6px}
.btn{border:1px solid rgba(255,255,255,.14);background:#1e293b;color:#e2e8f0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;transition:all .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#0ba4db;border-color:#0ba4db;color:#fff}
.btn-primary:hover:not(:disabled){background:#0891c2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:22px}
.plan-name{font-size:17px;font-weight:800;margin-bottom:10px}
.price{font-size:32px;font-weight:800;color:#fff;margin-bottom:2px}
.chip{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 9px;font-size:11px;color:#cbd5e1;margin:8px 4px 16px 0}
.badge-paystack{display:inline-flex;align-items:center;gap:6px;background:#0ba4db18;border:1px solid #0ba4db44;color:#7dd3fc;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;margin-bottom:16px}
.alert{padding:14px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.alert-icon{font-size:18px;flex-shrink:0}
.err{background:#7f1d1d;color:#fecaca;border:1px solid #991b1b}
.ok{background:#064e3b;color:#bbf7d0;border:1px solid #065f46}
.warn{background:#78350f;color:#fde68a;border:1px solid #92400e}
.info{background:#1e3a5f;color:#bae6fd;border:1px solid #1d4ed8}
.result-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:20px}
.result-screen.show{display:flex}
.result-icon{font-size:64px}
.result-title{font-size:26px;font-weight:800}
.result-sub{color:#94a3b8;font-size:15px;max-width:440px;line-height:1.7}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#0ba4db;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plans-section.hide{display:none}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>Subscription</h1>
      <p class="muted">Choose a plan to unlock all ERP modules for your school.</p>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="backBtn">Back to Dashboard</button>
      <button class="btn" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-title" id="resultTitle">Verifying payment...</div>
    <div class="result-sub" id="resultSub">Please wait while we confirm your payment.</div>
    <div class="spinner" id="resultSpinner"></div>
    <button class="btn btn-primary" id="resultBtn" style="display:none">Back to Plans</button>
  </div>

  <div class="plans-section" id="plansSection">
    <div id="status"></div>
    <div class="grid" id="plans"><div class="card">Loading plans...</div></div>
  </div>
</main>

<script type="module">
import { guardPage, subscriptions, logout, esc } from "/js/api.js";

const user        = guardPage(["PRINCIPAL","DEPUTY_PRINCIPAL","HOD","TEACHER","BURSAR"]);
const plansEl     = document.getElementById("plans");
const statusEl    = document.getElementById("status");
const resultScreen= document.getElementById("resultScreen");
const plansSection= document.getElementById("plansSection");
const resultTitle = document.getElementById("resultTitle");
const resultSub   = document.getElementById("resultSub");
const resultSpinner=document.getElementById("resultSpinner");
const resultBtn   = document.getElementById("resultBtn");

function showAlert(msg, type = "err") {
  statusEl.innerHTML = `<div class="alert ${type}"><span>${msg}</span></div>`;
}

function canPay() {
  return ["PRINCIPAL","DEPUTY_PRINCIPAL"].includes(user?.role);
}

async function startCheckout(plan, btn) {
  btn.disabled = true;
  btn.textContent = "Starting Paystack...";
  statusEl.innerHTML = "";

  const base  = window.API_BASE || "/api";
  const token = localStorage.getItem("cbc_erp_token");

  try {
    const r = await fetch(`${base}/subscriptions/paystack/checkout`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ plan_id: Number(plan.id) }),
    });
    const out = await r.json().catch(() => ({}));

    if (out?.redirect_url) {
      showAlert(`Redirecting to Paystack to pay KES ${Number(plan.amount).toLocaleString("en-KE")}…`, "info");
      setTimeout(() => { window.location.href = out.redirect_url; }, 600);
      return;
    }

    btn.disabled = false;
    btn.textContent = "Pay Now";
    showAlert(out?.message || "Could not start checkout. Please try again.", "err");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Pay Now";
    showAlert("Network error. Check your connection and try again.", "err");
  }
}

async function handleCallback() {
  const params       = new URLSearchParams(window.location.search);
  const paystackRef  = params.get("reference") || params.get("trxref");
  if (!paystackRef) return false;

  resultScreen.classList.add("show");
  plansSection.classList.add("hide");
  window.history.replaceState({}, "", window.location.pathname);

  const base  = window.API_BASE || "/api";
  const token = localStorage.getItem("cbc_erp_token");

  try {
    resultSub.textContent = "Confirming your Paystack payment…";
    const r = await fetch(`${base}/subscriptions/paystack/verify/${encodeURIComponent(paystackRef)}`, {
      headers: token ? { Authorization: `Bearer ${token}` } : {},
    });
    const data = await r.json().catch(() => ({}));
    if (!data.paid) throw new Error(data.message || "Payment not completed.");

    const subRes  = await fetch(`${base}/subscriptions/me`, { headers: { Authorization: `Bearer ${token}` } });
    const subData = await subRes.json().catch(() => ({}));
    const sub     = subData?.data;

    resultSpinner.style.display = "none";
    resultBtn.style.display     = "inline-block";

    if (sub?.status === "active" || sub?.status === "trialing") {
      resultTitle.textContent = "Payment Successful!";
      const end = new Date(sub.current_period_end).toLocaleDateString("en-KE", { day:"numeric", month:"long", year:"numeric" });
      resultSub.textContent   = `Your school is on the ${sub.plan_name} plan, active until ${end}.`;
      resultBtn.textContent   = "Go to Dashboard";
      resultBtn.onclick       = () => window.location.href = "/index.html";
    } else {
      resultTitle.textContent = "Payment Received — Awaiting Confirmation";
      resultSub.innerHTML     = `Your payment is being processed. This usually takes a few seconds.<br><br>Refresh this page in a moment if your subscription doesn't activate.`;
      resultBtn.textContent   = "Refresh";
      resultBtn.onclick       = () => window.location.href = "/subscription.html";
    }
  } catch (err) {
    resultSpinner.style.display = "none";
    resultTitle.textContent     = "Payment Verification Failed";
    resultSub.textContent       = "We couldn't confirm your payment. If you were charged, your subscription will activate shortly. Contact support if it doesn't.";
    resultBtn.style.display     = "inline-block";
    resultBtn.textContent       = "Back to Plans";
    resultBtn.onclick           = () => window.location.href = "/subscription.html";
  }
  return true;
}

async function load() {
  const isCallback = await handleCallback();
  if (isCallback) return;

  const current = await subscriptions.me();
  const sub = current?.data;
  if (sub?.status === "active" || sub?.status === "trialing") {
    const end = new Date(sub.current_period_end).toLocaleDateString("en-KE", { day:"numeric", month:"long", year:"numeric" });
    showAlert(`Your <strong>${esc(sub.plan_name)}</strong> plan is active until <strong>${end}</strong>.`, "ok");
  } else if (sub?.status === "past_due") {
    showAlert("Your subscription has expired. Renew below to restore staff access.", "warn");
  }

  const r = await subscriptions.plans();
  const plans = r?.data || [];
  if (!plans.length) {
    plansEl.innerHTML = '<div class="card">No plans available yet. Contact your administrator.</div>';
    return;
  }

  plansEl.innerHTML = plans.map(p => `
    <section class="card">
      <div class="plan-name">${esc(p.name)}</div>
      <div class="price">KES ${Number(p.amount).toLocaleString("en-KE")}</div>
      <div class="muted">per ${esc(p.billing_interval)}</div>
      <div>
        <span class="chip">${p.student_limit ? `Up to ${esc(String(p.student_limit))} students` : "Unlimited students"}</span>
        <span class="chip">${p.ai_enabled ? "AI included" : "No AI"}</span>
      </div>
      <div class="badge-paystack">Pay via Paystack · M-Pesa, Cards & Bank</div>
      ${canPay()
        ? `<button class="btn btn-primary" data-plan='${JSON.stringify({id:p.id,name:p.name,amount:p.amount,billing_interval:p.billing_interval})}'>Pay Now</button>`
        : `<button class="btn" disabled>Pay Now</button>
           <p class="muted" style="margin-top:8px;font-size:12px">Only a Principal or Deputy Principal can pay.</p>`
      }
    </section>
  `).join("");

  plansEl.querySelectorAll("[data-plan]").forEach(btn => {
    btn.addEventListener("click", () => {
      const plan = JSON.parse(btn.dataset.plan);
      startCheckout(plan, btn);
    });
  });
}

function dashboardDestination(role) {
  return {
    SUPER_ADMIN: "/super-admin.html",
    PRINCIPAL: "/school-admin.html",
    DEPUTY_PRINCIPAL: "/school-admin.html",
    HOD: "/school-admin.html",
    TEACHER: "/teacher.html",
    BURSAR: "/bursar.html",
  }[role] || "/school-admin.html";
}

document.getElementById("backBtn").addEventListener("click", () => {
  window.location.href = dashboardDestination(user?.role);
});
document.getElementById("logoutBtn").addEventListener("click", logout);
load();
</script>
</body>
</html>
