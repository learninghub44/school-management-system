<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password — CBC ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#1e1b4b,#312e81,#4338ca);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.icon{text-align:center;font-size:48px;margin-bottom:8px}
h1{text-align:center;font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px}
p.sub{text-align:center;font-size:13px;color:#64748b;margin-bottom:28px;font-weight:500}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fg input{width:100%;padding:12px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:14px;color:#0f172a;font-family:inherit;outline:none;transition:border-color .15s}
.fg input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.rules{background:#f8fafc;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:#64748b;border:1px solid #e2e8f0}
.rules li{margin-left:16px;margin-top:3px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;position:relative}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.35)}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.btn.loading{color:transparent}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;top:50%;left:50%;margin:-10px 0 0 -10px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-top:12px;font-weight:500;display:none}
.alert.show{display:block}
.alert-err{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.alert-ok{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Set New Password</h1>
  <p class="sub">Your account requires a password change before continuing.</p>
  <div class="rules">
    <strong>Password requirements:</strong>
    <ul>
      <li>Minimum 8 characters</li>
      <li>At least one uppercase letter</li>
      <li>At least one lowercase letter</li>
      <li>At least one number</li>
    </ul>
  </div>
  <div class="fg"><label>Current Password</label><input id="current_pw" type="password" autocomplete="current-password"></div>
  <div class="fg"><label>New Password</label><input id="new_pw" type="password" autocomplete="new-password"></div>
  <div class="fg"><label>Confirm New Password</label><input id="confirm_pw" type="password" autocomplete="new-password"></div>
  <button class="btn" id="changeBtn">Update Password</button>
  <div class="alert alert-err" id="errMsg"></div>
  <div class="alert alert-ok" id="okMsg"></div>
</div>
<script type="module">
import { auth, getUser, clearSession } from "/js/api.js";
const user = getUser();
if (!user) { window.location.href = "/login.html"; }

const btn = document.getElementById("changeBtn");
const errMsg = document.getElementById("errMsg");
const okMsg  = document.getElementById("okMsg");

btn.addEventListener("click", async () => {
  const current = document.getElementById("current_pw").value;
  const newPw   = document.getElementById("new_pw").value;
  const confirm = document.getElementById("confirm_pw").value;
  errMsg.className = "alert"; okMsg.className = "alert";

  if (!current || !newPw || !confirm) {
    errMsg.textContent = "All fields are required."; errMsg.classList.add("show","alert-err"); return;
  }
  if (newPw !== confirm) {
    errMsg.textContent = "New passwords do not match."; errMsg.classList.add("show","alert-err"); return;
  }
  if (newPw.length < 8 || !/[A-Z]/.test(newPw) || !/[a-z]/.test(newPw) || !/\d/.test(newPw)) {
    errMsg.textContent = "Password does not meet requirements."; errMsg.classList.add("show","alert-err"); return;
  }

  btn.disabled = true; btn.classList.add("loading");
  const res = await auth.changePassword({ current_password: current, new_password: newPw });
  btn.disabled = false; btn.classList.remove("loading");

  if (res?.success) {
    okMsg.textContent = "✓ Password changed! Redirecting to login…";
    okMsg.classList.add("show","alert-ok");
    setTimeout(() => { clearSession(); window.location.href = "/login.html"; }, 1800);
  } else {
    errMsg.textContent = res?.message || "Failed to change password.";
    errMsg.classList.add("show","alert-err");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });
</script>
</body>
</html>
